<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>مرجع مهندسی گلس، ال‌سی‌دی و قطعات | موبایل پرشیا</title>
<meta name="theme-color" content="#0b132b">
<style>
/* حالت ادغام‌شده (بدون هدر، بدون نوار وضعیت و بدون دکمه شناور) */
body.embedded header,
body.embedded .nav-tabs,
body.embedded .magic-fab { display: none !important; }
body.embedded { padding-bottom: 12px !important; }
@font-face{font-family:'Vazirmatn';font-weight:400;font-display:swap;src:url('font/Vazirmatn-Regular.woff2') format('woff2'),url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn-Regular.woff2') format('woff2');}
@font-face{font-family:'Vazirmatn';font-weight:700;font-display:swap;src:url('font/Vazirmatn-Bold.woff2') format('woff2'),url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn-Bold.woff2') format('woff2');}

:root {
  --primary:#2563eb; --primary-dark:#1d4ed8; --primary-light:#eff6ff;
  --parts-color:#7c3aed; --parts-dark:#5b21b6; --parts-light:#f5f3ff;
  --bat-color:#059669; --bat-light:#ecfdf5;
  --gold:#f59e0b; --danger:#ef4444; --success:#10b981;
  --bg:#f1f5f9; --card:#ffffff; --text:#0f172a; --muted:#64748b; --border:#e2e8f0;
  --radius:22px;
}
body.dark-mode {
  --primary:#3b82f6; --primary-dark:#2563eb; --primary-light:#1e293b;
  --parts-color:#a78bfa; --parts-dark:#7c3aed; --parts-light:#2e1065;
  --bat-color:#34d399; --bat-light:#064e3b;
  --bg:#0f172a; --card:#1e293b; --text:#f8fafc; --muted:#94a3b8; --border:#334155;
}

*{box-sizing:border-box;font-family:'Vazirmatn',system-ui,-apple-system,sans-serif;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);padding-bottom:70px;-webkit-tap-highlight-color:transparent;line-height:1.6;transition:background .3s,color .3s;}

header{position:sticky;top:0;z-index:100;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;color:#fff;overflow:hidden;background:linear-gradient(125deg,#0b132b 0%,#1e3a8a 45%,#1e1b4b 75%,#0b132b 100%);background-size:250% 250%;animation:royalDayFlow 10s ease-in-out infinite;border-bottom:1px solid rgba(96,165,250,.3);box-shadow:0 8px 25px rgba(15,23,42,.25);}
body.dark-mode header{background:radial-gradient(circle at 50% -20%,#1e1b4b 0%,#0f172a 85%)!important;border-bottom:1px solid rgba(147,197,253,.2)!important;box-shadow:0 8px 32px rgba(15,23,42,.6)!important;}
header::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#60a5fa,#a78bfa,transparent);opacity:.9;z-index:3;}
@keyframes royalDayFlow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shine{0%{background-position:200% center}100%{background-position:-200% center}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,.5)}50%{box-shadow:0 0 0 8px rgba(16,185,129,0)}}
@keyframes magicFadeIn{from{opacity:0;transform:translateY(-12px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes fabPulse{0%,100%{box-shadow:0 8px 25px rgba(139,92,246,.4),0 0 0 0 rgba(139,92,246,.5)}50%{box-shadow:0 12px 35px rgba(139,92,246,.6),0 0 0 12px rgba(139,92,246,0)}}

.text-wave{background:linear-gradient(90deg,#93c5fd 0%,#93c5fd 40%,#fff 45%,#e879f9 50%,#fff 55%,#93c5fd 60%,#93c5fd 100%);background-size:200% auto;color:transparent;-webkit-background-clip:text;background-clip:text;animation:shine 3s linear infinite;}
.header-actions{display:flex;gap:6px;flex-wrap:wrap;z-index:2;}
.icon-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;min-width:40px;height:40px;border-radius:12px;display:flex;justify-content:center;align-items:center;font-size:1rem;cursor:pointer;backdrop-filter:blur(8px);transition:transform .2s;padding:0 9px;font-weight:bold;}
.icon-btn:active{transform:scale(.9)}

.container{max-width:640px;margin:0 auto;padding:14px;}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:14px;border:1px solid var(--border);box-shadow:0 8px 24px rgba(0,0,0,.04);}
body.dark-mode .card{border-color:rgba(255,255,255,.08);box-shadow:0 8px 24px rgba(0,0,0,.3);}

.main-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--card);padding:7px;border-radius:20px;border:1px solid var(--border);margin-bottom:14px;box-shadow:0 6px 20px rgba(0,0,0,.04);}
.main-tab-btn{padding:12px 10px;border-radius:15px;border:none;background:transparent;color:var(--muted);font-weight:900;font-size:.86rem;cursor:pointer;transition:all .25s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;}
.main-tab-btn .tab-sub{font-size:.66rem;font-weight:700;opacity:.8;}
.main-tab-btn.active[data-tab="GLASS"]{background:linear-gradient(135deg,#2563eb 0%,#1d4ed8 100%);color:#fff;box-shadow:0 6px 16px rgba(37,99,235,.35);}
.main-tab-btn.active[data-tab="PARTS"]{background:linear-gradient(135deg,#7c3aed 0%,#5b21b6 100%);color:#fff;box-shadow:0 6px 16px rgba(124,58,237,.35);}

.parts-subfilter{display:none;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;}
.parts-subfilter.visible{display:flex;}
.subfilter-btn{flex:1;min-width:max-content;padding:8px 12px;border-radius:12px;border:1.5px solid var(--border);background:var(--card);color:var(--muted);font-size:.77rem;font-weight:800;cursor:pointer;transition:all .2s;text-align:center;}
.subfilter-btn.active{background:var(--parts-light);color:var(--parts-color);border-color:var(--parts-color);}
body.dark-mode .subfilter-btn.active{background:#2e1065;color:#ddd6fe;border-color:#8b5cf6;}

.search-wrap{position:relative;display:flex;align-items:center;}
.search-input{width:100%;padding:15px 46px 15px 88px;border-radius:16px;border:2px solid var(--primary);background:var(--bg);color:var(--text);font-size:1rem;font-weight:800;outline:none;transition:all .2s;box-shadow:0 4px 15px rgba(37,99,235,.1);}
body.parts-mode-active .search-input{border-color:var(--parts-color);box-shadow:0 4px 15px rgba(124,58,237,.12);}
.search-input:focus{box-shadow:0 0 0 4px rgba(37,99,235,.2);background:var(--card);}
.search-icon{position:absolute;right:15px;font-size:1.25rem;pointer-events:none;}
.search-hint{position:absolute;left:12px;display:flex;gap:4px;align-items:center;pointer-events:none;opacity:.65;}
.search-hint kbd{background:var(--card);border:1px solid var(--border);border-radius:5px;padding:2px 6px;font-size:.68rem;font-weight:900;font-family:monospace;color:var(--muted);box-shadow:0 1px 0 var(--border);}
.clear-btn{position:absolute;left:10px;width:30px;height:30px;border-radius:50%;background:rgba(239,68,68,.15);color:var(--danger);border:none;font-weight:bold;cursor:pointer;display:none;justify-content:center;align-items:center;}

.chips-scroll{display:flex;gap:7px;overflow-x:auto;padding:8px 2px 2px 2px;scrollbar-width:none;}
.chips-scroll::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 13px;border-radius:20px;font-size:.76rem;font-weight:800;background:var(--bg);color:var(--muted);border:1.5px solid var(--border);cursor:pointer;transition:all .2s;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;}
.chip:active{transform:scale(.94)}
.chip.active{background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%);color:#fff;border-color:var(--primary-dark);box-shadow:0 4px 10px rgba(37,99,235,.25);}
.section-label{font-size:.73rem;color:var(--muted);font-weight:800;margin-top:11px;display:flex;justify-content:space-between;align-items:center;}

.section-banner{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 15px;border-radius:15px;margin:16px 0 10px 0;font-weight:900;font-size:.88rem;}
.banner-exact{background:linear-gradient(135deg,#dcfce7 0%,#bbf7d0 100%);color:#166534;border:1px solid #86efac;}
.banner-size{background:linear-gradient(135deg,#fef3c7 0%,#fde68a 100%);color:#92400e;border:1px solid #fcd34d;}
.banner-lcd{background:linear-gradient(135deg,#ede9fe 0%,#ddd6fe 100%);color:#5b21b6;border:1px solid #c4b5fd;}
body.dark-mode .banner-exact{background:linear-gradient(135deg,#052e16 0%,#064e3b 100%);color:#86efac;border-color:#166534;}
body.dark-mode .banner-size{background:linear-gradient(135deg,#451a03 0%,#78350f 100%);color:#fcd34d;border-color:#92400e;}
body.dark-mode .banner-lcd{background:linear-gradient(135deg,#2e1065 0%,#4c1d95 100%);color:#ddd6fe;border-color:#6d28d9;}

.group-card{position:relative;border-right:6px solid var(--success)!important;overflow:hidden;}
.group-card.size-card{border-right-color:var(--gold)!important;}
.group-card.lcd-card{border-right-color:var(--parts-color)!important;}
.group-card.lcd-warn-card{border-right-color:var(--danger)!important;}
.group-card.bat-card{border-right-color:var(--bat-color)!important;}
.group-card.board-card{border-right-color:#0284c7!important;}

.group-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:11px;padding-bottom:10px;border-bottom:1px dashed var(--border);flex-wrap:wrap;}
.group-title{font-size:.98rem;font-weight:900;flex:1 1 100%;display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;}

.spec-badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px;width:100%;}
.spec-badge{padding:4px 9px;border-radius:8px;font-size:.71rem;font-weight:800;background:var(--primary-light);color:var(--primary);border:1px solid rgba(37,99,235,.2);display:inline-flex;align-items:center;gap:4px;}
body.dark-mode .spec-badge{background:#0f172a;color:#93c5fd;border-color:#334155;}

.edge-badge-FLAT{background:#dcfce7!important;color:#15803d!important;border-color:#86efac!important;}
.edge-badge-25D{background:#e0f2fe!important;color:#0369a1!important;border-color:#7dd3fc!important;}
.edge-badge-CURVED{background:#fae8ff!important;color:#a21caf!important;border-color:#f0abfc!important;}
body.dark-mode .edge-badge-FLAT{background:#052e16!important;color:#6ee7b7!important;border-color:#166534!important;}
body.dark-mode .edge-badge-25D{background:#082f49!important;color:#7dd3fc!important;border-color:#0369a1!important;}
body.dark-mode .edge-badge-CURVED{background:#4a044e!important;color:#f0abfc!important;border-color:#86198f!important;}

.gg-tag{padding:3px 8px;border-radius:6px;font-size:.69rem;font-weight:900;background:#fef2f2;color:#dc2626;border:1px solid #fecaca;direction:ltr;}
body.dark-mode .gg-tag{background:#450a0a;color:#fca5a5;border-color:#991b1b;}

.frame-badge-FULL{background:#dcfce7;color:#166534;border:1px solid #86efac;padding:4px 10px;border-radius:8px;font-size:.73rem;font-weight:900;}
.frame-badge-PANEL{background:#fef3c7;color:#92400e;border:1px solid #fde68a;padding:4px 10px;border-radius:8px;font-size:.73rem;font-weight:900;}
.frame-badge-TRAP{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5;padding:4px 10px;border-radius:8px;font-size:.73rem;font-weight:900;}
body.dark-mode .frame-badge-FULL{background:#052e16;color:#6ee7b7;border-color:#166534;}
body.dark-mode .frame-badge-PANEL{background:#451a03;color:#fcd34d;border-color:#92400e;}
body.dark-mode .frame-badge-TRAP{background:#450a0a;color:#fca5a5;border-color:#991b1b;}

.code-box{background:var(--bg);border:1px dashed var(--border);border-radius:11px;padding:8px 11px;margin-bottom:10px;font-size:.77rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;}
.code-pill{font-family:monospace;font-weight:900;font-size:.82rem;background:var(--card);color:var(--parts-color);padding:3px 9px;border-radius:7px;border:1.5px solid var(--border);direction:ltr;cursor:pointer;}
.code-pill:active{transform:scale(.93);}
.code-pill.bat-code{background:#ecfdf5;color:#047857;border-color:#6ee7b7;font-size:.88rem;}
body.dark-mode .code-pill.bat-code{background:#064e3b;color:#6ee7b7;border-color:#059669;}

.models-grid{display:flex;flex-wrap:wrap;gap:7px;}
.model-pill{padding:7px 11px;border-radius:10px;font-size:.81rem;font-weight:800;display:inline-flex;align-items:center;gap:5px;direction:ltr;border:1.5px solid transparent;transition:all .2s;cursor:pointer;user-select:none;}
.model-pill:active{transform:scale(.95)}
.brand-samsung{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe}
.brand-xiaomi{background:#fff7ed;color:#c2410c;border-color:#fed7aa}
.brand-apple{background:#f8fafc;color:#334155;border-color:#cbd5e1}
.brand-huawei{background:#fef2f2;color:#b91c1c;border-color:#fecaca}
.brand-honor{background:#f5f3ff;color:#6d28d9;border-color:#ddd6fe}
.brand-nokia{background:#ecfdf5;color:#047857;border-color:#a7f3d0}
.brand-realme{background:#fef9c3;color:#a16207;border-color:#fde68a}
.brand-tecno{background:#fce7f3;color:#be185d;border-color:#fbcfe8}
.brand-infinix{background:#e0f2fe;color:#0369a1;border-color:#bae6fd}

body.dark-mode .brand-samsung{background:#172554;color:#93c5fd;border-color:#1e40af}
body.dark-mode .brand-xiaomi{background:#431407;color:#fdba74;border-color:#9a3412}
body.dark-mode .brand-apple{background:#0f172a;color:#e2e8f0;border-color:#475569}
body.dark-mode .brand-huawei{background:#450a0a;color:#fca5a5;border-color:#991b1b}
body.dark-mode .brand-honor{background:#2e1065;color:#c4b5fd;border-color:#5b21b6}
body.dark-mode .brand-nokia{background:#052e16;color:#6ee7b7;border-color:#065f46}
body.dark-mode .brand-realme{background:#422006;color:#fde68a;border-color:#713f12}
body.dark-mode .brand-tecno{background:#500724;color:#fbcfe8;border-color:#9d174d}
body.dark-mode .brand-infinix{background:#082f49;color:#bae6fd;border-color:#075985}

.model-pill.searched{background:linear-gradient(135deg,#10b981 0%,#059669 100%)!important;color:#fff!important;border-color:#047857!important;animation:pulse 2s ease-in-out infinite;transform:scale(1.05);}

.fit-note{margin-top:11px;padding:9px 12px;border-radius:10px;font-size:.78rem;background:#fffbeb;color:#92400e;border-right:3px solid #f59e0b;font-weight:700;line-height:1.65;}
.tech-warn{margin-top:8px;padding:9px 12px;border-radius:10px;font-size:.78rem;background:#fef2f2;color:#991b1b;border-right:3px solid #ef4444;font-weight:800;line-height:1.65;}
body.dark-mode .fit-note{background:#422006;color:#fde68a;}
body.dark-mode .tech-warn{background:#450a0a;color:#fca5a5;}

.empty-state{text-align:center;padding:30px 16px;}
.delete-btn{background:#fee2e2;color:#dc2626;border:none;border-radius:8px;padding:3px 8px;font-size:.7rem;font-weight:bold;cursor:pointer;}

.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(8px);display:none;justify-content:center;align-items:center;z-index:1000;padding:14px;}
.modal-overlay.open{display:flex;}
.modal-content{background:var(--card);border-radius:22px;padding:20px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;border:1px solid var(--border);box-shadow:0 25px 50px -12px rgba(0,0,0,.4);}
.field-label{font-size:.8rem;font-weight:bold;color:var(--muted);margin-top:10px;display:block;}
input,select,textarea{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);margin-top:5px;font-size:.88rem;outline:none;font-family:inherit;}
.btn-primary{width:100%;padding:12px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%);color:#fff;font-weight:800;font-size:.92rem;cursor:pointer;box-shadow:0 4px 12px rgba(37,99,235,.3);}
.btn-purple{background:linear-gradient(135deg,#8b5cf6 0%,#6d28d9 100%)!important;box-shadow:0 4px 12px rgba(139,92,246,.3)!important;}

.magic-overlay{position:fixed;inset:0;background:rgba(11,19,43,.68);backdrop-filter:blur(16px);display:none;justify-content:center;align-items:flex-start;z-index:2000;padding:65px 14px 20px 14px;}
.magic-overlay.open{display:flex;}
.magic-box{background:var(--card);width:100%;max-width:580px;border-radius:22px;overflow:hidden;box-shadow:0 30px 80px -20px rgba(0,0,0,.6);animation:magicFadeIn .22s ease-out;max-height:calc(100vh - 90px);display:flex;flex-direction:column;border:1px solid var(--border);}
.magic-input-wrap{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border);gap:10px;}
.magic-input{flex:1;border:none!important;background:transparent!important;font-size:1.1rem!important;font-weight:800!important;color:var(--text);outline:none!important;margin:0!important;padding:0!important;}
.magic-close{background:var(--bg);color:var(--muted);border:none;width:32px;height:32px;border-radius:50%;cursor:pointer;font-weight:bold;}
.magic-results{flex:1;overflow-y:auto;padding:8px;}
.magic-result{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:12px;cursor:pointer;transition:background .15s;}
.magic-result:hover{background:var(--primary-light);}
.magic-fab{position:fixed;bottom:20px;left:20px;z-index:900;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#8b5cf6 0%,#6366f1 100%);color:#fff;font-size:1.4rem;border:none;cursor:pointer;display:flex;justify-content:center;align-items:center;animation:fabPulse 2.5s infinite;}

#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(15,23,42,.95);color:#fff;padding:10px 20px;border-radius:12px;font-size:.85rem;font-weight:bold;opacity:0;pointer-events:none;transition:all .3s;z-index:9999;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<header>
  <div style="display:flex;align-items:center;gap:12px;z-index:2;">
    <div style="position:relative;width:45px;height:45px;border-radius:14px;background:#0f172a;border:1px solid rgba(255,255,255,.15);display:flex;justify-content:center;align-items:center;overflow:hidden;flex-shrink:0;">
      <div style="position:absolute;width:150%;height:150%;background:conic-gradient(from 0deg,transparent,#22d3ee,#818cf8,#e879f9,transparent 60%);animation:spin 4s linear infinite;opacity:.75;"></div>
      <div style="position:absolute;inset:2px;background:#0f172a;border-radius:12px;z-index:1;"></div>
      <span style="position:relative;z-index:2;font-size:1.3rem;" id="header-icon">🛡️</span>
    </div>
    <div>
      <div style="font-size:1.05rem;font-weight:900;line-height:1.1;" id="header-title">مرجع گلس و قطعات مشابه</div>
      <div class="text-wave" style="font-size:.64rem;letter-spacing:2px;font-weight:bold;margin-top:3px;">PERSIA MOBILE PRO</div>
    </div>
  </div>
  <div class="header-actions">
    <button class="icon-btn" onclick="openDataImportModal()" title="به‌روزرسانی و بکاپ" style="background:rgba(139,92,246,.28);border-color:rgba(139,92,246,.5);">📥</button>
    <button class="icon-btn" onclick="openMagicSearch()" title="جستجوی جادویی (Ctrl+K)">✨</button>
    <button class="icon-btn" onclick="openCustomModal()" title="ثبت تجربه جدید">➕</button>
    <button class="icon-btn" onclick="toggleDarkMode()" id="theme-btn">🌙</button>
  </div>
</header>

<div class="container">
  <div class="main-tabs">
    <button type="button" class="main-tab-btn active" data-tab="GLASS" onclick="switchMainSection('GLASS', this)">
      <span>🛡️ بخش تخصصی گلس</span>
      <span class="tab-sub">تطابق ۱۰۰٪ یا حداکثر ±۱ میلی‌متر</span>
    </button>
    <button type="button" class="main-tab-btn" data-tab="PARTS" onclick="switchMainSection('PARTS', this)">
      <span>📱 ال‌سی‌دی، باتری و قطعات</span>
      <span class="tab-sub">کد فنی فلت، باتری (BN/EB) و برد شارژ</span>
    </button>
  </div>

  <div class="parts-subfilter" id="parts-subfilter-bar">
    <button type="button" class="subfilter-btn active" data-sub="ALL" onclick="setPartsSubFilter('ALL', this)">⚡ همه</button>
    <button type="button" class="subfilter-btn" data-sub="LCD" onclick="setPartsSubFilter('LCD', this)">📱 تاچ و ال‌سی‌دی</button>
    <button type="button" class="subfilter-btn" data-sub="BATTERY" onclick="setPartsSubFilter('BATTERY', this)">🔋 باتری</button>
    <button type="button" class="subfilter-btn" data-sub="BOARD" onclick="setPartsSubFilter('BOARD', this)">🔌 برد و فلت</button>
  </div>

  <div class="card" style="padding:15px;">
    <div class="search-wrap">

function loadDatabases() {
  applyFinalPrecisionPatches();
  let customGlass = [], customParts = [];
  try { customGlass = JSON.parse(localStorage.getItem(LS_GLASS_KEY) || '[]'); } catch(e){ customGlass = []; }
  try { customParts = JSON.parse(localStorage.getItem(LS_PARTS_KEY) || '[]'); } catch(e){ customParts = []; }
  if (!Array.isArray(customGlass)) customGlass = [];
  if (!Array.isArray(customParts)) customParts = [];
  ALL_GLASS = customGlass.concat(DEFAULT_GLASS_GROUPS);
  ALL_PARTS = customParts.concat(DEFAULT_LCD_GROUPS, DEFAULT_BATTERY_GROUPS, DEFAULT_BOARD_GROUPS);
  updateStats();
}

function updateStats() {
  const gModels = ALL_GLASS.reduce((a,g)=>a+g.models.length,0);
  const pModels = ALL_PARTS.reduce((a,g)=>a+g.models.length,0);
  const el = document.getElementById('stats-bar');
  if (el) el.innerText = `${gModels} مدل گلس • ${pModels} مدل قطعه در بانک`;
}

// استانداردسازی اعداد، علائم (+ به plus) و معادل‌های فارسی
function cleanDigitsAndSpaces(str) {
  return String(str || '').toLowerCase()
    .replace(/[۰-۹]/g, d => '0123456789'['۰۱۲۳۴۵۶۷۸۹'.indexOf(d)])
    .replace(/[٠-٩]/g, d => '0123456789'['٠١٢٣٤٥٦٧٨٩'.indexOf(d)])
    .replace(/\+/g, ' plus ')
    .replace(/آیفون|ایفون|اپل/g, 'iphone')
    .replace(/سامسونگ|گلکسی/g, 'samsung')
    .replace(/شیائومی|شیاومی/g, 'xiaomi')
    .replace(/ردمی/g, 'redmi')
    .replace(/پوکو/g, 'poco')
    .replace(/هواوی|هوآوی/g, 'huawei')
    .replace(/آنر|انر|هانر/g, 'honor')
    .replace(/نوکیا/g, 'nokia')
    .replace(/ریلمی/g, 'realme')
    .replace(/تکنو/g, 'tecno')
    .replace(/اینفینیکس/g, 'infinix');
}

// نرمال‌سازی با حفظ زیربرندهای کلیدی (حذف mi اضافه تا "Xiaomi 11T" و "Xiaomi Mi 11T" هر دو یکسان شوند)
function normalizeCore(str) {
  return cleanDigitsAndSpaces(str)
    .replace(/\b(samsung|galaxy|xiaomi|apple|huawei)\b/g, '')
    .replace(/\bmi\s+(?=\d)/g, '')
    .replace(/\bsm-/g, '')
    .replace(/[\s\-_\/\(\)،,]+/g, '');
}

// نرمال‌سازیِ خالص مدل (بدون نام برند)
function normalizeBareModel(str) {
  return cleanDigitsAndSpaces(str)
    .replace(/\b(samsung|galaxy|xiaomi|redmi|poco|mi|apple|iphone|huawei|honor|nokia|realme|tecno|infinix)\b/g, '')
    .replace(/\bsm-/g, '')
    .replace(/[\s\-_\/\(\)،,]+/g, '');
}

function detectExplicitBrandInQuery(rawQuery) {
  const s = cleanDigitsAndSpaces(rawQuery);
  if (/\b(iphone|apple)\b/.test(s)) return 'apple';
  if (/\b(samsung|galaxy|sm-)\b/.test(s)) return 'samsung';
  if (/\b(xiaomi|redmi|poco|mi)\b/.test(s)) return 'xiaomi';
  if (/\b(honor)\b/.test(s)) return 'honor';
  if (/\b(huawei|nova|y9|y7|y6|p30|p40|mate)\b/.test(s)) return 'huawei';
  if (/\b(nokia)\b/.test(s)) return 'nokia';
  if (/\b(realme|narzo)\b/.test(s)) return 'realme';
  if (/\b(tecno|spark|camon)\b/.test(s)) return 'tecno';
  if (/\b(infinix)\b/.test(s)) return 'infinix';
  return null;
}

// تشخیص دقیق برند هر مدل (بررسی Honor قبل از الگوهای هواوی برای جلوگیری از تداخل Honor 9X / 8X)
function detectBrand(name) {
  const n = String(name).toLowerCase();
  if (/\bhonor\b/.test(n)) return 'honor';
  if (/iphone|apple/.test(n)) return 'apple';
  if (/samsung|galaxy|sm-/.test(n)) return 'samsung';
  if (/xiaomi|redmi|poco|\bmi\b/.test(n)) return 'xiaomi';
  if (/huawei|nova|y9|y7|y6|p40|p30|mate/.test(n)) return 'huawei';
  if (/nokia/.test(n)) return 'nokia';
  if (/realme|narzo/.test(n)) return 'realme';
  if (/tecno|spark|camon/.test(n)) return 'tecno';
  if (/infinix/.test(n)) return 'infinix';
  return 'samsung';
}

const brandIcon = {apple:'🍎',samsung:'🔵',xiaomi:'🟠',huawei:'🔴',honor:'🟣',nokia:'🟢',realme:'🟡',tecno:'🟤',infinix:'🔘'};

function filterByBrand(list) {
  if (activeBrand === 'ALL') return list;
  return list.filter(g => g.models.some(m => {
    const b = detectBrand(m);
    if (activeBrand === 'realme') return b === 'realme' || b === 'tecno' || b === 'infinix';
    return b === activeBrand;
  }));
}

function expandSlashVariants(mainModelPart) {
  const expanded = mainModelPart.replace(/\b(\S+)\s+4g\s*\/\s*5g\b/gi, '$1 4G / $1 5G');
  const rawParts = expanded.split('/').map(s => s.trim()).filter(Boolean);
  if (rawParts.length <= 1) return rawParts;

  const firstWords = rawParts[0].split(/\s+/);
  const brandPrefix = firstWords.slice(0, Math.min(2, firstWords.length - 1)).join(' ');
  return rawParts.map((p, idx) => {
    if (idx === 0) return p;
    if (/^(samsung|galaxy|xiaomi|redmi|poco|apple|iphone|huawei|honor|nokia|realme|tecno|infinix)\b/i.test(p)) return p;
    return brandPrefix ? (brandPrefix + ' ' + p) : p;
  });
}

// بررسی دقیق تطابق مدل با کوئری کاربر
function modelMatchesQuery(modelStr, rawQuery) {
  const qClean = cleanDigitsAndSpaces(rawQuery).trim();
  if (!qClean) return false;

  const queryBrand = detectExplicitBrandInQuery(qClean);
  const modelBrand = detectBrand(modelStr);

  if (queryBrand && queryBrand !== modelBrand) return false;

  const parenMatch = modelStr.match(/\((.*?)\)/);
  const mainModelPart = modelStr.replace(/\s*\(.*?\)/g, '').trim();
  const parenPart = parenMatch ? parenMatch[1].trim() : '';

  const subParts = expandSlashVariants(mainModelPart);
  const qCore = normalizeCore(qClean);
  const qBare = normalizeBareModel(qClean);

  if (parenPart && qBare.length >= 3) {
    const pNorm = normalizeCore(parenPart);
    if (pNorm === qBare || pNorm.includes(qBare)) return true;
  }

  const isShortPureNum = /^\d{1,2}$/.test(qBare);

  for (let i = 0; i < subParts.length; i++) {
    const partStr = subParts[i];
    const mCore = normalizeCore(partStr);
    const mBare = normalizeBareModel(partStr);

    if (checkTokenBoundaryMatch(mCore, qCore)) return true;

    if (!isShortPureNum && qBare.length >= 2) {
      if (checkTokenBoundaryMatch(mBare, qBare)) return true;
    }
  }

  return false;
}

// بررسی مرز کلمه پس از تطابق (پشتیبانی دوطرفه از 4G/5G/NFC و سال‌های تولید 2017-2026)
function checkTokenBoundaryMatch(targetNorm, queryNorm) {
  if (!targetNorm || !queryNorm) return false;
  if (targetNorm === queryNorm) return true;

  // تطابق معکوس برای زمانی که کوئری کاربر دارای پسوند 4g/5g/nfc است اما نام مدل در تب گلس بدون 4g/5g ثبت شده (مثلاً "Note 10 Pro 4G" -> "Note 10 Pro")
  const qStripped = queryNorm.replace(/(4g|5g|nfc)+$/, '');
  if (qStripped && qStripped !== queryNorm && targetNorm === qStripped) return true;

  const idx = targetNorm.indexOf(queryNorm);
  if (idx === -1) return false;

  if (idx > 0 && queryNorm.length < 3) return false;

  const remainder = targetNorm.slice(idx + queryNorm.length);
  if (!remainder) return true;

    if (/^(201\d|202\d)(4g|5g|nfc)?$/.test(remainder)) return true;
  if (/^(4g|5g|nfc|china|global|india|duos)+$/.test(remainder)) return true;
  if (/^\d/.test(remainder)) return false;

  return false;

}
// === پایان قسمت ۳-الف (کد قسمت ۳-ب را دقیقاً زیر این خط پیست کنید) ===
// =========================================================================
// 🎨 قسمت ۳-ب: الگوریتم هندسی گلس (≤ 1.0mm)، رندر کارت‌ها و کنترلرهای برنامه
// =========================================================================
function findAllMatches(rawQuery) {
  const qCore = normalizeCore(rawQuery);
  const detectedBrand = detectExplicitBrandInQuery(rawQuery);

const brandAliases = {
  apple: /apple|iphone/gi,
  samsung: /samsung|galaxy/gi,
  xiaomi: /xiaomi|redmi|poco/gi,
  huawei: /huawei|nova/gi,
  honor: /honor/gi,
  nokia: /nokia/gi,
  realme: /realme|narzo/gi,
  tecno: /tecno|spark|camon/gi,
  infinix: /infinix/gi
};
const stripped = normalizeCore(
    cleanDigitsAndSpaces(rawQuery).replace(brandAliases[detectedBrand] || detectedBrand || '', '')
  );
  if (detectedBrand && !stripped) {
    const brandSource = ALL_GLASS.filter(g =>
      g.models.some(m => detectBrand(m) === detectedBrand)
    );
    const partsSource = ALL_PARTS.filter(g =>
      g.models.some(m => detectBrand(m) === detectedBrand)
    );
    return {
      isDefaultView: true,
      exactGlass: brandSource.map(g => ({ group: g, matched: [] })),
      sizeGlass: [],
      exactParts: partsSource.map(g => ({ group: g, matched: [], matchedCodes: [] }))
    };
  }

  const glassSource = filterByBrand(ALL_GLASS);
  const partsSource = filterByBrand(ALL_PARTS);

  if (!qCore) {
    let filteredParts = partsSource;
    if (currentPartsSub === 'LCD') filteredParts = filteredParts.filter(g => g.partType === 'LCD');
    else if (currentPartsSub === 'BATTERY') filteredParts = filteredParts.filter(g => g.partType === 'BATTERY');
    else if (currentPartsSub === 'BOARD') filteredParts = filteredParts.filter(g => g.partType === 'BOARD');

    return {
      isDefaultView: true,
      exactGlass: glassSource.map(g => ({group: g, matched: []})),
      sizeGlass: [],
      exactParts: filteredParts.map(g => ({group: g, matched: [], matchedCodes: []}))
    };
  }

  // ۱. جستجوی دقیق در گلس‌ها
  const exactGlass = [];
  glassSource.forEach(g => {
    const matched = g.models.filter(m => modelMatchesQuery(m, rawQuery));
    if (matched.length > 0) {
      exactGlass.push({group: g, matched});
    }
  });


// =========================================================================
// 🛡️ دیتابیس مهندسی گلس — قانون سخت‌گیرانه: تطابق ۱۰۰٪ یا حداکثر تلورانس ±۱.۰ میلی‌متر
  // ۲. الگوریتم هندسی گلس‌های هم‌ابعاد با تلورانس سخت‌گیرانه حداکثر ±۱.۰ میلی‌متر در طول و عرض
  const sizeGlass = [];
  if (exactGlass.length > 0) {
    const refGroups = exactGlass.map(e => e.group);
    glassSource.forEach(candidate => {
      if (exactGlass.some(e => e.group.id === candidate.id)) return;
      for (const ref of refGroups) {
        if ((ref.edge === 'CURVED' && candidate.edge !== 'CURVED') || (ref.edge !== 'CURVED' && candidate.edge === 'CURVED')) continue;
        const widthDiff = (ref.w && candidate.w) ? Math.abs(ref.w - candidate.w) : 99;
        const lenDiff = (ref.l && candidate.l) ? Math.abs(ref.l - candidate.l) : 99;

        if (widthDiff <= 1.0 && lenDiff <= 1.0) {
          const dL = Math.round(lenDiff * 10) / 10;
          const dW = Math.round(widthDiff * 10) / 10;
          const edgeWarn = ref.edge !== candidate.edge
            ? `تطابق ابعاد (${candidate.l}×${candidate.w}mm) — توجه به تفاوت لبه (${candidate.edgeLabel})`
            : `تطابق هندسی در محدوده ≤ ۱mm (${candidate.l}×${candidate.w}mm | اختلاف طول: ${dL}mm، عرض: ${dW}mm)`;
          sizeGlass.push({group: candidate, matched: [], geoNote: edgeWarn});
          break;
        }
      }
    });
  }

  // ۳. جستجوی دقیق در ال‌سی‌دی، باتری و برد شارژ
  const exactParts = [];
  partsSource.forEach(g => {
    if (currentPartsSub === 'LCD' && g.partType !== 'LCD') return;
    if (currentPartsSub === 'BATTERY' && g.partType !== 'BATTERY') return;
    if (currentPartsSub === 'BOARD' && g.partType !== 'BOARD') return;

    const matchedModels = g.models.filter(m => modelMatchesQuery(m, rawQuery));
    const matchedCodes = (g.codes || []).filter(c => {
      const cNorm = normalizeCore(c);
      return cNorm === qCore || (qCore.length >= 3 && cNorm.includes(qCore));
    });

    if (matchedModels.length > 0 || matchedCodes.length > 0) {
      exactParts.push({group: g, matched: matchedModels, matchedCodes});
    }
  });

  return { isDefaultView: false, exactGlass, sizeGlass, exactParts, rawQuery };
}

function getCleanSearchTermFromModel(fullModelStr) {
  let s = fullModelStr.replace(/\s*\(.*?\)/g, '').trim();
  s = s.replace(/^(Samsung Galaxy|Samsung|Xiaomi|Redmi|Poco|Apple|iPhone|Huawei|Honor|Nokia|Realme|Tecno|Infinix)\s+/i, '').trim();
  if (s.includes('/')) s = s.split('/')[0].trim();
  return s.replace(/'/g, '');
}

function renderGlassCard(entry, isSizeAlt) {
  const g = entry.group;
  const matchedSet = new Set(entry.matched || []);
  const isCustom = String(g.id).startsWith('custom_gl_');

  const pillsHTML = g.models.map(m => {
    const brand = detectBrand(m);
    const isMatch = matchedSet.has(m);
    const shortName = m.replace(/^(Samsung Galaxy|Xiaomi|Apple|Huawei|Honor|Nokia|Realme|Tecno|Infinix)\s+/i, '');
    const clickTerm = getCleanSearchTermFromModel(m);
    return `<span class="model-pill brand-${brand}${isMatch?' searched':''}" onclick="quickSearch('${clickTerm}')">
              ${brandIcon[brand]||'📱'} ${shortName}
            </span>`;
  }).join('');

  const dimBadge = (g.l && g.w) ? `<span class="spec-badge" dir="ltr">📐 ${g.l} × ${g.w} mm</span>` : '';
  const edgeCls = 'edge-badge-' + (g.edge || 'FLAT');
  const ggTagsHTML = (g.tags || []).map(t => `<span class="gg-tag">${t}</span>`).join('');
  const delBtn = isCustom ? `<button class="delete-btn" onclick="deleteCustomEntry('GLASS','${g.id}')">🗑 حذف</button>` : '';

  return `
    <div class="card group-card ${isSizeAlt ? 'size-card' : ''}">
      <div class="group-header">
        <div class="group-title"><span>🛡️ ${g.title}</span>${delBtn}</div>
        <div class="spec-badges">
          <span class="spec-badge">📏 ${g.size} اینچ</span>
          ${dimBadge}
          <span class="spec-badge ${edgeCls}">${g.edgeLabel || '📐 استاندارد'}</span>
          <span class="spec-badge">${g.notch || ''}</span>
          ${ggTagsHTML}
        </div>
      </div>
      <div class="models-grid">${pillsHTML}</div>
      ${entry.geoNote ? `<div class="tech-warn" style="background:#fff7ed;color:#c2410c;border-color:#f97316;">⚖️ ارزیابی هندسی: ${entry.geoNote}</div>` : ''}
      ${g.note ? `<div class="fit-note">💡 ${g.note}</div>` : ''}
    </div>
  `;
}

function renderPartsCard(entry) {
  const g = entry.group;
  const matchedSet = new Set(entry.matched || []);
  const isCustom = String(g.id).startsWith('custom_part_');
  const isTrap = g.frameType === 'TRAP';
  const isBat = g.partType === 'BATTERY';
  const isBoard = g.partType === 'BOARD';

  const pillsHTML = g.models.map(m => {
    const brand = detectBrand(m);
    const isMatch = matchedSet.has(m);
    const shortName = m.replace(/^(Samsung Galaxy|Xiaomi|Apple|Huawei|Honor|Nokia|Realme|Tecno|Infinix)\s+/i, '');
    const clickTerm = getCleanSearchTermFromModel(m);
    return `<span class="model-pill brand-${brand}${isMatch?' searched':''}" onclick="quickSearch('${clickTerm}')">
              ${brandIcon[brand]||'📱'} ${shortName}
            </span>`;
  }).join('');

  const codesHTML = (g.codes && g.codes.length > 0)
    ? `<div class="code-box">
         <span style="font-weight:800;color:var(--muted);">${isBat ? '🔋 کد باتری:' : (isBoard ? '🔌 کد برد:' : '🔩 کد فلت:')}</span>
         <div style="display:flex;gap:5px;flex-wrap:wrap;">
           ${g.codes.map(c => `<span class="code-pill ${isBat?'bat-code':''}" onclick="quickSearch('${String(c).replace(/'/g,'')}')">${c}</span>`).join('')}
         </div>
       </div>`
    : '';

  let cardCls = 'lcd-card';
  if (isTrap) cardCls = 'lcd-warn-card';
  else if (isBat) cardCls = 'bat-card';
  else if (isBoard) cardCls = 'board-card';

  const delBtn = isCustom ? `<button class="delete-btn" onclick="deleteCustomEntry('PARTS','${g.id}')">🗑 حذف</button>` : '';

  return `
    <div class="card group-card ${cardCls}">
      <div class="group-header">
        <div class="group-title"><span>${isBat ? '🔋' : (isBoard ? '🔌' : '📱')} ${g.title}</span>${delBtn}</div>
        <div class="spec-badges">
          <span class="frame-badge-${g.frameType || 'PANEL'}">${g.frameLabel || 'مشترک'}</span>
          ${g.panelSpec ? `<span class="spec-badge" dir="ltr">🔬 ${g.panelSpec}</span>` : ''}
        </div>
      </div>
      ${codesHTML}
      <div class="models-grid">${pillsHTML}</div>
      ${g.note ? `<div class="fit-note">💡 ${g.note}</div>` : ''}
      ${g.techWarn ? `<div class="tech-warn">${g.techWarn}</div>` : ''}
    </div>
  `;
}

function handleSearch() {
  const rawQuery = document.getElementById('search-input').value.trim();
  document.getElementById('clear-btn').style.display = rawQuery ? 'flex' : 'none';
  document.getElementById('search-hint').style.display = rawQuery ? 'none' : 'flex';

  const res = findAllMatches(rawQuery);
  const container = document.getElementById('results');
  let html = '';

  if (currentMainTab === 'GLASS') {
    if (res.exactGlass.length > 0) {
      html += `<div class="section-banner banner-exact">
                 <span>🛡️ گلس‌های هم‌قالب و تأییدشده (${res.exactGlass.length} گروه)</span>
                 <span style="font-size:.72rem;opacity:.85;">تطابق ۱۰۰٪ یا حداکثر ±۱mm</span>
               </div>`;
      res.exactGlass.forEach(e => { html += renderGlassCard(e, false); });
    }
    if (!res.isDefaultView && res.sizeGlass.length > 0) {
      html += `<div class="section-banner banner-size">
                 <span>📐 گلس‌های جایگزین بسیار نزدیک (${res.sizeGlass.length} گروه)</span>
                 <span style="font-size:.72rem;">تلورانس طول و عرض ≤ ۱.۰mm</span>
               </div>`;
      res.sizeGlass.forEach(e => { html += renderGlassCard(e, true); });
    }
  } else {
    if (res.exactParts.length > 0) {
      html += `<div class="section-banner banner-lcd">
                 <span>📱 ال‌سی‌دی، باتری و برد (${res.exactParts.length} مورد)</span>
                 <span style="font-size:.72rem;opacity:.85;">بر اساس کد فنی</span>
               </div>`;
      res.exactParts.forEach(e => { html += renderPartsCard(e); });
    }
  }

  if (!html) {
    const tabName = (currentMainTab === 'GLASS') ? 'گلس' : 'ال‌سی‌دی/قطعات';
    const q = rawQuery.replace(/'/g,'');
    html = `<div class="card empty-state">
              <div style="font-size:3rem;margin-bottom:8px;">🧐</div>
              <div style="font-weight:900;font-size:1rem;">موردی برای «${rawQuery}» در بخش ${tabName} پیدا نشد</div>
              <div style="font-size:.82rem;color:var(--muted);margin:8px 0 14px 0;">می‌توانید این تجربه فنی را به دیتابیس اضافه کنید:</div>
              <button class="btn-primary" style="width:auto;padding:10px 22px;" onclick="openCustomModal('${q}')">➕ ثبت در بانک</button>
            </div>`;
  }

  container.innerHTML = html;
}

function openMagicSearch() {
  document.getElementById('magic-overlay').classList.add('open');
  const inp = document.getElementById('magic-input');
  inp.value = '';
  handleMagicSearch('');
  setTimeout(() => inp.focus(), 80);
}
function closeMagicSearch() {
  document.getElementById('magic-overlay').classList.remove('open');
}
function handleMagicSearch(qRaw) {
  const q = normalizeCore(qRaw);
  const box = document.getElementById('magic-results');
  if (!q) {
    box.innerHTML = `<div style="padding:25px;text-align:center;color:var(--muted);font-size:.85rem;">مدل (مثل <b>A50</b> یا <b>iPhone SE</b>)، کد باتری (مثل <b>BN61</b>) یا کد فلت را تایپ کنید...</div>`;
    return;
  }
  const res = findAllMatches(qRaw);
  let html = '';
  res.exactParts.slice(0, 5).forEach(e => {
    html += `<div class="magic-result" onclick="selectMagic('${qRaw.replace(/'/g,'')}','PARTS')">
               <div style="font-size:1.3rem;">📱</div>
               <div style="flex:1;">
                 <div style="font-weight:900;font-size:.88rem;color:var(--parts-color);">${e.group.title}</div>
                 <div style="font-size:.74rem;color:var(--muted);">${e.group.frameLabel} • ${(e.group.codes||[]).join(', ')}</div>
               </div>
             </div>`;
  });
  res.exactGlass.slice(0, 5).forEach(e => {
    html += `<div class="magic-result" onclick="selectMagic('${qRaw.replace(/'/g,'')}','GLASS')">
               <div style="font-size:1.3rem;">🛡️</div>
               <div style="flex:1;">
                 <div style="font-weight:900;font-size:.88rem;color:var(--primary);">${e.group.title}</div>
                 <div style="font-size:.74rem;color:var(--muted);">📏 ${e.group.size}" • ${e.group.edgeLabel}</div>
               </div>
             </div>`;
  });
  box.innerHTML = html || `<div style="padding:25px;text-align:center;color:var(--muted);">موردی یافت نشد.</div>`;
}
function selectMagic(term, targetTab) {
  closeMagicSearch();
  if (targetTab && targetTab !== currentMainTab) {
    const btn = document.querySelector(`.main-tab-btn[data-tab="${targetTab}"]`);
    if (btn) switchMainSection(targetTab, btn);
  }
  quickSearch(term);
}

function openCustomModal(prefill) {
  document.getElementById('cg-title').value = prefill ? `مشترک ${prefill}` : '';
  document.getElementById('cg-models').value = prefill ? `${prefill}, ` : '';
  document.getElementById('cg-note').value = '';
  document.getElementById('cg-codes').value = '';
  document.getElementById('modal-custom').classList.add('open');
  toggleCustomFormFields();
}
function closeCustomModal() { document.getElementById('modal-custom').classList.remove('open'); }

function toggleCustomFormFields() {
  const t = document.getElementById('cg-type').value;
  document.getElementById('cg-glass-fields').style.display = (t === 'GLASS') ? 'block' : 'none';
  document.getElementById('cg-parts-fields').style.display = (t !== 'GLASS') ? 'block' : 'none';
}

function saveCustomEntry() {
  const type = document.getElementById('cg-type').value;
  const titleIn = document.getElementById('cg-title').value.trim();
  const rawModels = document.getElementById('cg-models').value;
  const note = document.getElementById('cg-note').value.trim();
  const models = rawModels.split(/[,،\n\-|]+/).map(s => s.trim()).filter(Boolean);
  if (models.length < 1) return showToast('⚠️ حداقل یک مدل وارد کنید');

  if (type === 'GLASS') {
    const size = parseFloat(document.getElementById('cg-size').value) || 6.5;
    const dimStr = document.getElementById('cg-dim').value.trim();
    let l = 0, w = 0;
    if (dimStr) {
      const p = dimStr.split(/[×xX*,\s]+/).map(Number).filter(Boolean);
      if (p.length >= 2) { l = Math.max(p[0], p[1]); w = Math.min(p[0], p[1]); }
    }
    const edgeSel = document.getElementById('cg-edge');
    const edge = edgeSel.value;
    const edgeLabel = edgeSel.options[edgeSel.selectedIndex].text;
    const notch = document.getElementById('cg-notch').value;
    const newG = {
      id: 'custom_gl_' + Date.now(),
      title: titleIn || `گلس مشترک ${models.slice(0,2).join(' / ')}`,
      size, l, w, edge, edgeLabel, notch, note, models, tags: []
    };
    let saved = [];
    try { saved = JSON.parse(localStorage.getItem(LS_GLASS_KEY) || '[]'); } catch(e){ saved = []; }
    if (!Array.isArray(saved)) saved = [];
    saved.unshift(newG);
    localStorage.setItem(LS_GLASS_KEY, JSON.stringify(saved));
  } else {
    const frameSel = document.getElementById('cg-frame');
    const frameType = frameSel.value;
    const frameLabel = frameSel.options[frameSel.selectedIndex].text;
    const panelSpec = document.getElementById('cg-panel').value.trim();
    const codes = document.getElementById('cg-codes').value.split(/[,،\s]+/).map(s=>s.trim()).filter(Boolean);
    const partType = (type === 'BATTERY') ? 'BATTERY' : ((type === 'BOARD') ? 'BOARD' : 'LCD');
    const newP = {
      id: 'custom_part_' + Date.now(),
      partType,
      title: titleIn || `${type === 'BATTERY' ? 'باتری' : (type === 'BOARD' ? 'برد' : 'ال‌سی‌دی')} مشترک ${models.slice(0,2).join(' / ')}`,
      frameType, frameLabel, panelSpec, codes, models, note, techWarn: ''
    };
    let saved = [];
    try { saved = JSON.parse(localStorage.getItem(LS_PARTS_KEY) || '[]'); } catch(e){ saved = []; }
    if (!Array.isArray(saved)) saved = [];
    saved.unshift(newP);
    localStorage.setItem(LS_PARTS_KEY, JSON.stringify(saved));
  }

  loadDatabases();
  closeCustomModal();
  handleSearch();
  showToast('✅ ذخیره شد');
}

function deleteCustomEntry(type, id) {
  if (!confirm('این گروه حذف شود؟')) return;
  const key = (type === 'GLASS') ? LS_GLASS_KEY : LS_PARTS_KEY;
  let saved = [];
  try { saved = JSON.parse(localStorage.getItem(key) || '[]'); } catch(e){ saved = []; }
  if (!Array.isArray(saved)) saved = [];
  saved = saved.filter(g => g.id !== id);
  localStorage.setItem(key, JSON.stringify(saved));
  loadDatabases();
  handleSearch();
  showToast('🗑️ حذف شد');
}

function openDataImportModal() { document.getElementById('modal-data-import').classList.add('open'); }
function closeDataImportModal() { document.getElementById('modal-data-import').classList.remove('open'); }

function exportBackupJSON() {
  const data = {
    version: 'PersiaMobile_PartsPro_v8_Ultimate',
    date: new Date().toISOString(),
    customGlass: JSON.parse(localStorage.getItem(LS_GLASS_KEY) || '[]'),
    customParts: JSON.parse(localStorage.getItem(LS_PARTS_KEY) || '[]')
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'Persia_Parts_Pro_Backup.json';
  a.click();
  showToast('✅ بکاپ دانلود شد');
}

function importBackupJSON(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    try {
      const d = JSON.parse(evt.target.result);
      if (Array.isArray(d.customGlass)) localStorage.setItem(LS_GLASS_KEY, JSON.stringify(d.customGlass));
      if (Array.isArray(d.customParts)) localStorage.setItem(LS_PARTS_KEY, JSON.stringify(d.customParts));
      loadDatabases();
      handleSearch();
      closeDataImportModal();
      showToast('✅ بکاپ بازیابی شد');
    } catch(err) { showToast('❌ فایل نامعتبر'); }
  };
  reader.readAsText(file);
}

function processBatchImport() {
  const txt = document.getElementById('import-text-area').value.trim();
  if (!txt) return showToast('⚠️ متنی وارد نشده');
  const models = txt.split(/[\n,،\-|]+/).map(s=>s.trim()).filter(s=>s.length>2);
  if (models.length === 0) return;
  let saved = [];
  try { saved = JSON.parse(localStorage.getItem(LS_GLASS_KEY) || '[]'); } catch(e){ saved = []; }
  if (!Array.isArray(saved)) saved = [];
  saved.unshift({
    id: 'custom_gl_' + Date.now(),
    title: '📥 ' + models.slice(0,2).join(' / '),
    size: 6.5, l: 161, w: 75, edge: 'FLAT', edgeLabel: '📐 تخت',
    notch: '⚫ پانچ وسط', note: 'اضافه‌شده از ورود دسته‌ای.', models, tags: []
  });
  localStorage.setItem(LS_GLASS_KEY, JSON.stringify(saved));
  loadDatabases();
  closeDataImportModal();
  handleSearch();
  showToast(`✅ ${models.length} مدل اضافه شد`);
}

function toggleDarkMode() {
  document.body.classList.toggle('dark-mode');
  const isDark = document.body.classList.contains('dark-mode');
  localStorage.setItem('pm_glass_theme', isDark ? 'dark' : 'light');
  document.getElementById('theme-btn').innerText = isDark ? '☀️' : '🌙';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.innerText = msg;
  t.classList.add('show');
  clearTimeout(window._tTimer);
  window._tTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    openMagicSearch();
  } else if (e.key === 'Escape') {
    closeMagicSearch();
  }
});

document.getElementById('search-input').addEventListener('input', handleSearch);

(function init() {
  if (localStorage.getItem('pm_glass_theme') === 'dark') {
    document.body.classList.add('dark-mode');
    document.getElementById('theme-btn').innerText = '☀️';
  }
  loadDatabases();
  handleSearch();
})();
</script>

<script>
// 🛡️ اسکریپت قفل‌شکن و مخفی‌کننده هدر در حالت iframe
(function() {
  var isEmbed = location.search.indexOf('embed=1') !== -1 || window.parent !== window;
  if (isEmbed) {
    document.documentElement.classList.add('embedded');
    
    // به محض لود شدن DOM، هدرها رو مخفی کن
    document.addEventListener('DOMContentLoaded', function() {
      document.body.classList.add('embedded');
      var header = document.querySelector('header');
      if (header) header.style.display = 'none';
      var fab = document.querySelector('.magic-fab');
      if (fab) fab.style.display = 'none';
      var tabs = document.querySelector('.nav-tabs');
      if (tabs) tabs.style.display = 'none';
      
      // حذف فاصله بالای صفحه
      document.body.style.paddingTop = '0';
    });
  }
})();
</script>
