<!-- 🖨️ سیستم جامع و بدون خطای چاپ، PDF و تصویر فاکتور A5 (موبایل پرشیا) -->
<!-- ═══════════════════════════════════════════════════════════════════ -->
<style>
.printer-overlay, #printer-overlay, #apk-print-toolbar {
  display: none !important;
  opacity: 0 !important;
  pointer-events: none !important;
}
#persia-print-studio {
  display: none;
  position: fixed;
  inset: 0;
  background: #0f172a;
  z-index: 99999998;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  overflow-y: auto;
  padding: 68px 10px 28px 10px;
  direction: rtl;
}
#persia-print-studio.open {
  display: flex !important;
}
#persia-print-studio.fullscreen-shot {
  padding: 0 !important;
  background: #ffffff !important;
}
#persia-print-studio.fullscreen-shot #pps-toolbar,
#persia-print-studio.fullscreen-shot #pps-hint {
  display: none !important;
}
#persia-print-studio.fullscreen-shot #pps-preview-wrap {
  box-shadow: none !important;
  border-radius: 0 !important;
  max-width: 100vw !important;
  width: 100vw !important;
}
#pps-toolbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 58px;
  background: rgba(15, 23, 42, 0.96);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(255,255,255,0.15);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 8px;
  gap: 5px;
  z-index: 10;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}
.pps-btn {
  border: none !important;
  border-radius: 10px !important;
  padding: 9px 8px !important;
  font-size: 0.73rem !important;
  font-weight: 900 !important;
  color: #fff !important;
  cursor: pointer !important;
  margin: 0 !important;
  width: auto !important;
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
  gap: 4px !important;
  white-space: nowrap !important;
}
#pps-preview-wrap {
  width: 100%;
  max-width: 520px;
  background: #fff;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 15px 40px rgba(0,0,0,0.6);
}
#pps-preview-img {
  width: 100%;
  height: auto;
  display: block;
}
#pps-hint {
  color: #93c5fd;
  font-size: 0.74rem;
  font-weight: bold;
  text-align: center;
  margin-bottom: 8px;
  line-height: 1.5;
}
#path-info-modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(15,23,42,0.88);
  z-index: 99999999;
  align-items: center;
  justify-content: center;
  padding: 16px;
  direction: rtl;
}
#path-info-modal.open {
  display: flex !important;
}
</style>

<!-- پنجره پیش‌نمایش و دکمه‌های خروجی فاکتور -->
<div id="persia-print-studio" onclick="if(this.classList.contains('fullscreen-shot')) this.classList.remove('fullscreen-shot');">
  <div id="pps-toolbar" onclick="event.stopPropagation();">
    <button type="button" class="pps-btn" onclick="closePersiaPrintStudio()" style="background:#ef4444;">⬅ بستن</button>
    <button type="button" class="pps-btn" id="pps-btn-pdf" onclick="exportPersiaInvoice('PDF')" style="flex:1.2;background:linear-gradient(135deg,#10b981 0%,#047857 100%);">📄 PDF</button>
    <button type="button" class="pps-btn" id="pps-btn-png" onclick="exportPersiaInvoice('PNG')" style="flex:1.2;background:linear-gradient(135deg,#f59e0b 0%,#d97706 100%);">🖼️ عکس</button>
    <button type="button" class="pps-btn" onclick="triggerNativeSystemPrint()" style="flex:1;background:#6366f1;">🖨️ پرینت</button>
    <button type="button" class="pps-btn" onclick="enableFullscreenShot()" style="background:#2563eb;" title="تمام‌صفحه">📱</button>
  </div>

  <div id="pps-hint">
    💡 برای ارسال به پرینتر یا واتساپ روی <b>«📄 PDF»</b> یا <b>«🖼️ عکس»</b> بزنید (در مرورگر می‌توانید روی <b>«🖨️ پرینت»</b> هم بزنید).
  </div>

  <div id="pps-preview-wrap" onclick="if(document.getElementById('persia-print-studio').classList.contains('fullscreen-shot')) { document.getElementById('persia-print-studio').classList.remove('fullscreen-shot'); event.stopPropagation(); }">
    <img id="pps-preview-img" src="" alt="در حال آماده‌سازی تصویر فاکتور...">
  </div>
</div>

<!-- پنجره نمایش مسیر ذخیره فایل در گوشی -->
<div id="path-info-modal">
  <div style="background:#fff;border-radius:16px;padding:20px;max-width:400px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,0.5);">
    <div style="text-align:center;margin-bottom:16px;">
      <div style="font-size:3rem;margin-bottom:8px;">✅</div>
      <div style="font-weight:900;font-size:1.1rem;color:#10b981;">فاکتور در گوشی ذخیره شد</div>
    </div>
    <div style="background:#f0fdf4;border:1px solid #86efac;border-radius:10px;padding:12px;margin-bottom:16px;font-size:0.85rem;line-height:1.8;color:#166534;">
      <div><b>📁 پوشه:</b> <span id="pim-folder-name">Documents</span></div>
      <div style="margin-top:6px;"><b>📄 نام فایل:</b></div>
      <div id="pim-file-name" style="background:#fff;padding:8px;border-radius:6px;margin-top:4px;direction:ltr;text-align:left;font-family:monospace;font-size:0.78rem;word-break:break-all;color:#0f172a;">Invoice.pdf</div>
    </div>
    <div style="background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:12px;margin-bottom:16px;font-size:0.82rem;line-height:1.7;color:#92400e;">
      <b>🔍 چطور فایل رو پرینت کنم؟</b><br>
      در برنامه «مدیریت فایل» (Files) گوشی وارد پوشه بالا شوید؛ فایل فاکتور آماده چاپ است.
    </div>
    <button type="button" onclick="document.getElementById('path-info-modal').classList.remove('open')" style="width:100%;background:linear-gradient(135deg,#10b981 0%,#047857 100%);color:#fff;padding:14px;border:none;border-radius:10px;font-size:1rem;font-weight:900;cursor:pointer;">باشه، ممنون</button>
  </div>
</div>

<script>
(function() {
  var _nativePrint = window.print ? window.print.bind(window) : function(){};
  var _lastCanvas = null;
  var _lastCode = 'Factor';

  function hideOldPrinterOverlays() {
    var els = document.querySelectorAll('.printer-overlay, #printer-overlay, #apk-print-toolbar');
    for (var i = 0; i < els.length; i++) els[i].style.display = 'none';
    document.body.classList.remove('apk-print-mode');
  }

  window.closePersiaPrintStudio = function() {
    var st = document.getElementById('persia-print-studio');
    if (st) st.classList.remove('open', 'fullscreen-shot');
    hideOldPrinterOverlays();
  };

  window.enableFullscreenShot = function() {
    var st = document.getElementById('persia-print-studio');
    if (st) {
      st.classList.add('fullscreen-shot');
      if (typeof showToast === 'function') showToast('📸 اسکرین‌شات بگیرید (برای بازگشت، روی صفحه بزنید)', 'info');
    }
  };

  window.triggerNativeSystemPrint = function() {
    var st = document.getElementById('persia-print-studio');
    if (st) st.classList.remove('open');
    setTimeout(function() {
      try { _nativePrint(); } catch (e) {}
    }, 150);
  };

  function showPathInfoModal(folderLabel, filename) {
    var fEl = document.getElementById('pim-folder-name');
    var nEl = document.getElementById('pim-file-name');
    var modal = document.getElementById('path-info-modal');
    if (fEl) fEl.innerText = folderLabel;
    if (nEl) nEl.innerText = filename;
    if (modal) modal.classList.add('open');
  }

  // ─────────────────────────────────────────────────────────────
  // ۱. تابع اصلی ساخت و چاپ قبض پذیرش دو تکه A5 (مشتری + کارگاه)
  // ─────────────────────────────────────────────────────────────
  window.printIntakeReceipt = function(recordId) {
    var q = null;
    if (typeof quotes !== 'undefined') {
      q = quotes.find(function(x) { return x.id === Number(recordId) && !x.deleted; });
    }
    if (!q && typeof transactions !== 'undefined') {
      q = transactions.find(function(x) { return x.id === Number(recordId) && !x.deleted; });
    }
    if (!q) {
      if (typeof showToast === 'function') showToast('فاکتور مورد نظر یافت نشد', 'error');
      return;
    }

    var c = (typeof customers !== 'undefined' && customers.find(function(x) { return x.id === q.customerId && !x.deleted; })) || { name: 'مشتری گرامی', phone: '---' };
    var loyalty = (typeof getCustomerLoyalty === 'function') ? getCustomerLoyalty(c.id) : { tier: 'عادی', custCode: '---' };

    var totalAmt = Number(q.amount != null ? q.amount : (q.totalWork || 0));
    var rawAmt = Number(q.rawAmount || totalAmt);
    var discAmt = Number(q.loyaltyDiscountAmount || 0);
    var cashDep = Number(q.cashDeposit != null ? q.cashDeposit : (q.deposit || 0));
    var onlineDep = Number(q.onlineDeposit || 0);
    var totalDep = cashDep + onlineDep;
    var remain = Math.max(0, totalAmt - totalDep);

    var codeToTrack = q.shortCode || q.trackCode || q.intakeCode || '';
    var qrSrc = (typeof getQrCodeUrl === 'function') ? getQrCodeUrl(codeToTrack) : '';
    var devName = ((q.brand && q.brand !== 'سایر' ? q.brand + ' ' : '') + (q.model || 'نامشخص') + (q.color ? ' (' + q.color + ')' : '')).trim();

    var conds = [];
    if (q.isDead) conds.push('شرط خاموشی (مرگ برد)');
    if (q.isWater) conds.push('آب‌خوردگی/سولفاته');
    if (q.isLcdRisk) conds.push('ریسک شکستگی LCD');
    if (q.isScratch) conds.push('خط و خش/ضربه شاسی');
    if (q.isOpened) conds.push('قبلاً باز شده');
    if (q.hasSim) conds.push('سیم‌کارت/رم همراه دارد');
    var condStr = conds.length > 0 ? conds.join(' ، ') : 'عادی';

    var lockStr = 'بدون رمز';
    if (q.lockType === 'PIN' && q.lockVal) lockStr = 'پین/رمز: ' + q.lockVal;
    else if (q.lockType === 'PATTERN' && (q.patternPath || q.lockVal)) lockStr = 'الگو: ' + (q.patternPath || q.lockVal);

    var itemsRowsHtml = '';
    var tableRowsData = [];
    if (q.items && q.items.length > 0) {
      q.items.forEach(function(it) {
        var tStr = it.title || 'خدمات تعمیرات';
        var aStr = formatToman(it.amount || 0);
        itemsRowsHtml += '<tr><td>' + esc(tStr) + '</td><td style="text-align:left;font-weight:bold;">' + esc(aStr) + '</td></tr>';
        tableRowsData.push({ col1: tStr, col2: aStr });
      });
    } else {
      var defTitle = q.problem || q.title || 'تعمیرات تخصصی موبایل';
      itemsRowsHtml = '<tr><td>' + esc(defTitle) + '</td><td style="text-align:left;font-weight:bold;">' + esc(formatToman(totalAmt)) + '</td></tr>';
      tableRowsData.push({ col1: defTitle, col2: formatToman(totalAmt) });
    }

    var headerSubText = 'شماره قبض: ' + (q.intakeCode || '---') + '   |   کد پیگیری: ' + (codeToTrack || '---') + '   |   تاریخ: ' + (q.date || '');
    var lawText = '⚖️ شرایط حقوقی: ۱. قبض پذیرش تا ۳۰ روز اعتبار دارد و پس از آن تعمیرگاه مسئولیتی در قبال نگهداری دستگاه ندارد. ۲. در دستگاه‌های آب‌خورده، ضربه‌خورده یا دارای شرط خاموشی، ریسک خاموشی کامل یا عدم تصویر بر عهده مشتری است. ۳. تحویل دستگاه منوط به ارائه این قبض و تسویه کامل است.';

    // بازسازی کامل HTML داخل #print-section (برای پشتیبانی از چاپ مستقیم مرورگر)
    var printSec = document.getElementById('print-section');
    if (printSec) {
      printSec.innerHTML =
        '<div class="print-page">' +
          '<div class="print-half" id="print-customer-part">' +
            '<div class="r-watermark">PERSIA</div>' +
            '<div class="r-header">' +
              '<span class="r-badge">نسخه مشتری</span>' +
              '<div class="r-title">تعمیرات تخصصی موبایل پرشیا</div>' +
              '<div style="font-size:7pt;margin-top:1mm;">' + esc(headerSubText) + '</div>' +
              (qrSrc ? '<div class="r-qr-box"><img src="' + qrSrc + '" alt="QR"><div class="r-qr-caption">استعلام آنلاین</div></div>' : '') +
            '</div>' +
            '<div class="r-meta"><table>' +
              '<tr><td><b>مشتری:</b> ' + esc(c.name) + ' (' + esc(loyalty.tier) + ')</td><td><b>تلفن:</b> ' + esc(c.phone || '---') + '</td></tr>' +
              '<tr><td><b>مدل دستگاه:</b> ' + esc(devName) + '</td><td><b>سریال/IMEI:</b> ' + esc(q.imei || '---') + '</td></tr>' +
              '<tr><td colspan="2"><b>ایراد اظهارشده:</b> ' + esc(q.problem || 'بررسی تخصصی') + '   |   <b>متعلقات:</b> ' + esc(q.acc || 'ندارد') + '</td></tr>' +
              '<tr><td colspan="2"><b>شرایط ظاهری و پذیرش:</b> ' + esc(condStr) + '   |   <b>گارانتی:</b> ' + esc(q.warranty || '48 ساعت مهلت تست') + '</td></tr>' +
            '</table></div>' +
            '<table class="r-table"><thead><tr><th>شرح خدمات / قطعه</th><th style="width:32%;">مبلغ</th></tr></thead><tbody>' + itemsRowsHtml + '</tbody></table>' +
            '<div class="r-totals">' +
              (discAmt > 0 ? '<div><span>جمع کل: ' + formatToman(rawAmt) + '</span><span>تخفیف وفاداری: ' + formatToman(discAmt) + '</span></div>' : '') +
              '<div><span>مبلغ قابل پرداخت: <b>' + formatToman(totalAmt) + '</b></span><span>بیعانه دریافتی: <b>' + formatToman(totalDep) + '</b></span></div>' +
              '<div class="r-total-final"><span>مانده قابل پرداخت هنگام تحویل:</span><span>' + formatToman(remain) + '</span></div>' +
            '</div>' +
            '<div class="r-law">' + lawText + '</div>' +
            '<div class="r-sign"><div>امضای مشتری (تایید شرایط):<div class="line"></div></div><div>مهر و امضای موبایل پرشیا:<div class="line"></div></div></div>' +
          '</div>' +
          '<div class="cut-line-mid">✂ ───────── محل برش ───────── ✂</div>' +
          '<div class="print-half split" id="print-shop-part">' +
            '<div class="workshop-col" id="print-shop-workshop">' +
              '<div class="r-header"><span class="r-badge">نسخه کارگاه</span><div class="r-title">پرونده فنی کارگاه</div><div style="font-size:6.8pt;">' + esc(headerSubText) + '</div></div>' +
              '<div class="r-meta">' +
                '<div><b>مشتری:</b> ' + esc(c.name) + ' | <b>تلفن:</b> ' + esc(c.phone || '---') + '</div>' +
                '<div><b>مدل:</b> ' + esc(devName) + '</div>' +
              '</div>' +
              '<div class="r-tech">' +
                '<div><b>ایراد اعلامی:</b> ' + esc(q.problem || '---') + '</div>' +
                '<div><b>قفل دستگاه:</b> ' + esc(lockStr) + '</div>' +
                '<div><b>شرایط پذیرش:</b> ' + esc(condStr) + '</div>' +
                '<div><b>متعلقات:</b> ' + esc(q.acc || 'ندارد') + (q.marker ? ' | <b>نشانه:</b> ' + esc(q.marker) : '') + '</div>' +
                (q.qcSummary ? '<div><b>تست QC:</b> ' + esc(q.qcSummary) + '</div>' : '') +
                (q.internalDiagnosis ? '<div><b>تشخیص فنی:</b> ' + esc(q.internalDiagnosis) + '</div>' : '') +
                '<div><b>مبلغ کل:</b> ' + formatToman(totalAmt) + ' | <b>بیعانه:</b> ' + formatToman(totalDep) + ' | <b>مانده:</b> ' + formatToman(remain) + '</div>' +
              '</div>' +
            '</div>' +
            '<div class="notes-col" id="print-shop-notes">' +
              '<div class="r-notes-title">📝 یادداشت تعمیرکار</div>' +
              '<div class="r-notes-lines">' + (q.internalNotes ? '<div style="font-size:6.5pt;padding:1mm;">' + esc(q.internalNotes) + '</div>' : '') + '</div>' +
              '<div class="r-tech-sign">امضای تکنسین و تاریخ تحویل:<div class="line"></div></div>' +
            '</div>' +
          '</div>' +
        '</div>';
    }

    _lastCode = String(q.intakeCode || q.trackCode || 'Factor');

    var totalsArr = [];
    if (discAmt > 0) totalsArr.push({ label: 'جمع ناخالص: ' + formatToman(rawAmt), val: 'تخفیف وفاداری: ' + formatToman(discAmt), isFinal: false });
    totalsArr.push({ label: 'مبلغ کل: ' + formatToman(totalAmt), val: 'بیعانه: ' + formatToman(totalDep), isFinal: false });
    totalsArr.push({ label: 'مانده قابل پرداخت:', val: formatToman(remain), isFinal: true });

    var structuredData = {
      mode: 'SPLIT_A5',
      title: 'تعمیرات تخصصی موبایل پرشیا',
      headerSub: headerSubText,
      qrSrc: qrSrc,
      metaLines: [
        'مشتری: ' + c.name + ' (' + loyalty.tier + ')   |   تلفن: ' + (c.phone || '---'),
        'مدل دستگاه: ' + devName + (q.imei ? '   |   IMEI: ' + q.imei : ''),
        'ایراد اظهارشده: ' + (q.problem || 'بررسی تخصصی') + '   |   متعلقات: ' + (q.acc || 'ندارد'),
        'شرایط پذیرش: ' + condStr + '   |   گارانتی: ' + (q.warranty || '48 ساعت مهلت تست')
      ],
      tableRows: tableRowsData,
      totals: totalsArr,
      lawText: lawText,
      shopHeaderSub: 'قبض: ' + (q.intakeCode || '---') + ' | تاریخ: ' + (q.date || ''),
      shopMetaLines: [
        'مشتری: ' + c.name + '  |  تلفن: ' + (c.phone || '---'),
        'مدل: ' + devName
      ],
      shopTechLines: [
        'ایراد: ' + (q.problem || '---'),
        'قفل صفحه: ' + lockStr,
        'شرایط: ' + condStr,
        'متعلقات: ' + (q.acc || 'ندارد') + (q.marker ? ' | نشانه: ' + q.marker : ''),
        'مبلغ: ' + formatToman(totalAmt) + ' | بیعانه: ' + formatToman(totalDep) + ' | مانده: ' + formatToman(remain)
      ]
    };

    if (q.qcSummary) structuredData.shopTechLines.push('تست QC: ' + q.qcSummary);
    if (q.internalDiagnosis) structuredData.shopTechLines.push('تشخیص فنی: ' + q.internalDiagnosis);

    openStudioWithData(structuredData);
  };

  // ─────────────────────────────────────────────────────────────
  // ۲. تابع چاپ فاکتور رسمی مشتری (تک‌صفحه‌ای A5)
  // ─────────────────────────────────────────────────────────────
  window.printCustomerInvoice = function(txId) {
    var t = null;
    if (typeof transactions !== 'undefined') {
      t = transactions.find(function(x) { return x.id === Number(txId) && !x.deleted; });
    }
    if (!t && typeof quotes !== 'undefined') {
      t = quotes.find(function(x) { return x.id === Number(txId) && !x.deleted; });
    }
    if (!t) {
      if (typeof showToast === 'function') showToast('فاکتور یافت نشد', 'error');
      return;
    }

    var c = (typeof customers !== 'undefined' && customers.find(function(x) { return x.id === t.customerId && !x.deleted; })) || { name: 'مشتری گرامی', phone: '---' };
    var totalAmt = Number(t.totalWork != null ? t.totalWork : (t.amount || 0));
    var depAmt = Number(t.deposit || 0);
    var remain = Math.max(0, totalAmt - depAmt);

    var tableRows = [['ردیف', 'شرح کالا / خدمات', 'مبلغ (تومان)']];
    if (t.items && t.items.length > 0) {
      t.items.forEach(function(it, idx) {
        tableRows.push([String(idx + 1), it.title || 'خدمات', formatToman(it.amount || 0)]);
      });
    } else {
      tableRows.push(['1', t.title || 'خدمات تعمیرات و فروش', formatToman(totalAmt)]);
    }
    tableRows.push(['-', 'جمع کل فاکتور', formatToman(totalAmt)]);
    if (depAmt > 0) tableRows.push(['-', 'دریافتی / بیعانه', formatToman(depAmt)]);
    tableRows.push(['-', 'مانده نهایی', remain > 0 ? formatToman(remain) : 'تسویه کامل']);

    _lastCode = String(t.intakeCode || t.trackCode || 'Invoice');

    openStudioWithData({
      mode: 'SINGLE_PAGE',
      rawLines: [
        'فاکتور رسمی خدمات و فروش — موبایل پرشیا',
        'نام مشتری: ' + c.name + '   |   تلفن: ' + (c.phone || '---'),
        'تاریخ: ' + (t.date || '') + (t.intakeCode ? '   |   شماره قبض: ' + t.intakeCode : ''),
        'مدل دستگاه / عنوان: ' + (t.model || t.title || '---') + '   |   گارانتی: ' + (t.warranty || '48 ساعت مهلت تست')
      ],
      table: tableRows
    });
  };

  function openStudioWithData(data) {
    hideOldPrinterOverlays();
    var studio = document.getElementById('persia-print-studio');
    var previewImg = document.getElementById('pps-preview-img');
    if (studio) studio.classList.add('open');

    renderReceiptToCanvas(data).then(function(canvas) {
      _lastCanvas = canvas;
      if (previewImg) previewImg.src = canvas.toDataURL('image/png');
    });
  }

  function roundRect(ctx, x, y, w, h, r, fill, stroke, strokeColor, lineWidth) {
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) {
      ctx.strokeStyle = strokeColor || '#333';
      ctx.lineWidth = lineWidth || 2;
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawWrappedRTL(ctx, text, xRight, yStart, maxWidth, lineHeight, maxLines) {
    var words = String(text || '').replace(/\r/g, '').split(/\s+/);
    var line = '';
    var y = yStart;
    var linesCount = 0;
    ctx.save();
    ctx.direction = 'rtl';
    ctx.textAlign = 'right';
    for (var n = 0; n < words.length; n++) {
      var testLine = line + (line ? ' ' : '') + words[n];
      if (ctx.measureText(testLine).width > maxWidth && line !== '') {
        ctx.fillText(line, xRight, y);
        line = words[n];
        y += lineHeight;
        linesCount++;
        if (maxLines && linesCount >= maxLines - 1) break;
      } else {
        line = testLine;
      }
    }
    if (line) {
      ctx.fillText(line, xRight, y);
      y += lineHeight;
    }
    ctx.restore();
    return y;
  }

  function loadSafeImage(url) {
    return new Promise(function(resolve) {
      if (!url) return resolve(null);
      var img = new Image();
      img.crossOrigin = 'anonymous';
      var timer = setTimeout(function() { resolve(null); }, 1500);
      img.onload = function() { clearTimeout(timer); resolve(img); };
      img.onerror = function() { clearTimeout(timer); resolve(null); };
      img.src = url;
    });
  }

  async function renderReceiptToCanvas(data) {
    var canvas = document.createElement('canvas');
    var W = 1480, H = 2100;
    canvas.width = W;
    canvas.height = H;
    var ctx = canvas.getContext('2d');

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);
    var fontName = 'Vazirmatn, Tahoma, Arial, sans-serif';

    if (!data || data.mode === 'SINGLE_PAGE') {
      roundRect(ctx, 36, 36, W - 72, H - 72, 14, '#ffffff', true, '#222', 4);
      ctx.fillStyle = '#0f172a';
      ctx.font = 'bold 34px ' + fontName;
      ctx.textAlign = 'center';
      var headTitle = (data && data.rawLines && data.rawLines[0]) ? data.rawLines[0] : 'صورت‌حساب رسمی — موبایل پرشیا';
      ctx.fillText(headTitle, W / 2, 100);
      ctx.beginPath(); ctx.moveTo(70, 130); ctx.lineTo(W - 70, 130); ctx.strokeStyle = '#333'; ctx.lineWidth = 2; ctx.stroke();

      var y = 185;
      ctx.font = 'bold 23px ' + fontName;
      ctx.textAlign = 'right';
      if (data && data.rawLines) {
        var maxL = Math.min(data.rawLines.length, 6);
        for (var i = 1; i < maxL; i++) {
          ctx.fillText(data.rawLines[i], W - 70, y);
          y += 45;
        }
      }
      if (data && data.table && data.table.length > 0) {
        y += 20;
        var tblW = W - 140;
        var maxR = Math.min(data.table.length, 24);
        for (var rIdx = 0; rIdx < maxR; rIdx++) {
          var row = data.table[rIdx];
          var cellW = tblW / row.length;
          ctx.fillStyle = rIdx === 0 ? '#e2e8f0' : '#ffffff';
          ctx.fillRect(70, y, tblW, 50);
          ctx.strokeStyle = '#64748b';
          ctx.strokeRect(70, y, tblW, 50);
          ctx.fillStyle = '#000';
          ctx.font = (rIdx === 0 ? 'bold 22px ' : 'bold 20px ') + fontName;
          ctx.textAlign = 'center';
          for (var c = 0; c < row.length; c++) {
            var cx = (W - 70) - (c * cellW) - (cellW / 2);
            ctx.fillText(row[c], cx, y + 33);
          }
          y += 50;
        }
      }
      ctx.fillStyle = '#000';
      ctx.font = 'bold 22px ' + fontName;
      ctx.textAlign = 'right';
      ctx.fillText('امضای مشتری: .........................................', W - 80, H - 100);
      ctx.textAlign = 'left';
      ctx.fillText('مهر و امضای موبایل پرشیا: .........................................', 80, H - 100);
      return canvas;
    }

    // رسم نیمه بالایی (نسخه مشتری)
    var cX = 32, cY = 28, cW = W - 64, cH = 1015;
    roundRect(ctx, cX, cY, cW, cH, 12, '#ffffff', true, '#222222', 3.5);

    ctx.save();
    ctx.translate(cX + cW / 2, cY + cH / 2);
    ctx.rotate(-28 * Math.PI / 180);
    ctx.font = '900 135px Arial, sans-serif';
    ctx.fillStyle = 'rgba(0, 0, 0, 0.038)';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('PERSIA', 0, 0);
    ctx.restore();

    roundRect(ctx, cX + cW - 155, cY + 18, 135, 42, 6, '#f8fafc', true, '#333', 2);
    ctx.fillStyle = '#000';
    ctx.font = 'bold 21px ' + fontName;
    ctx.textAlign = 'center';
    ctx.fillText('نسخه مشتری', cX + cW - 87, cY + 46);

    ctx.fillStyle = '#000';
    ctx.font = '900 32px ' + fontName;
    ctx.textAlign = 'center';
    ctx.fillText(data.title, W / 2, cY + 50);

    ctx.font = 'bold 21px ' + fontName;
    ctx.fillStyle = '#334155';
    ctx.fillText(data.headerSub || '', W / 2, cY + 86);

    var qrImg = await loadSafeImage(data.qrSrc);
    var qrX = cX + 22, qrY = cY + 14, qrSize = 92;
    roundRect(ctx, qrX, qrY, qrSize, qrSize, 6, '#fff', true, '#333', 2);
    if (qrImg) {
      ctx.drawImage(qrImg, qrX + 3, qrY + 3, qrSize - 6, qrSize - 6);
    } else {
      ctx.fillStyle = '#0f172a';
      ctx.font = 'bold 16px ' + fontName;
      ctx.textAlign = 'center';
      ctx.fillText('کد قبض', qrX + qrSize / 2, qrY + 38);
      ctx.font = 'bold 20px monospace';
      ctx.fillText(_lastCode, qrX + qrSize / 2, qrY + 68);
    }

    var curY = cY + 116;
    ctx.beginPath(); ctx.moveTo(cX + 20, curY); ctx.lineTo(cX + cW - 20, curY);
    ctx.strokeStyle = '#333'; ctx.lineWidth = 2; ctx.stroke();
    curY += 34;

    ctx.fillStyle = '#000';
    ctx.font = 'bold 21px ' + fontName;
    ctx.textAlign = 'right';
    for (var mIdx = 0; mIdx < data.metaLines.length; mIdx++) {
      curY = drawWrappedRTL(ctx, data.metaLines[mIdx], cX + cW - 24, curY, cW - 48, 32, 2);
    }
    curY += 6;

    var tX = cX + 22, tW = cW - 44, colSplit = tX + 340, thH = 42;
    roundRect(ctx, tX, curY, tW, thH, 4, '#e2e8f0', true, '#64748b', 2);
    ctx.beginPath(); ctx.moveTo(colSplit, curY); ctx.lineTo(colSplit, curY + thH); ctx.strokeStyle = '#64748b'; ctx.stroke();
    ctx.fillStyle = '#000';
    ctx.font = 'bold 21px ' + fontName;
    ctx.textAlign = 'right';
    ctx.fillText('شرح خدمات / قطعه', tX + tW - 16, curY + 28);
    ctx.textAlign = 'center';
    ctx.fillText('مبلغ', tX + 170, curY + 28);
    curY += thH;

    var maxTRows = Math.min(data.tableRows.length, 5);
    for (var trI = 0; trI < maxTRows; trI++) {
      var r = data.tableRows[trI];
      var rH = 42;
      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(tX, curY, tW, rH);
      ctx.beginPath(); ctx.moveTo(colSplit, curY); ctx.lineTo(colSplit, curY + rH); ctx.stroke();
      ctx.fillStyle = '#000';
      ctx.font = 'bold 20px ' + fontName;
      ctx.textAlign = 'right';
      ctx.fillText(r.col1 || '', tX + tW - 14, curY + 28);
      ctx.textAlign = 'center';
      ctx.fillText(r.col2 || '', tX + 170, curY + 28);
      curY += rH;
    }

    curY += 28;

    for (var totI = 0; totI < data.totals.length; totI++) {
      var tot = data.totals[totI];
      if (tot.isFinal) {
        ctx.beginPath(); ctx.moveTo(tX, curY - 18); ctx.lineTo(tX + tW, curY - 18);
        ctx.strokeStyle = '#333'; ctx.lineWidth = 2; ctx.stroke();
        curY += 8;
      }
      ctx.font = (tot.isFinal ? '900 24px ' : 'bold 21px ') + fontName;
      ctx.fillStyle = tot.isFinal ? '#b91c1c' : '#0f172a';
      ctx.textAlign = 'right';
      ctx.fillText(tot.label, tX + tW - 6, curY);
      if (tot.val) {
        ctx.textAlign = 'left';
        ctx.fillText(tot.val, tX + 6, curY);
      }
      curY += 34;
    }

    if (data.lawText) {
      var lawY = Math.max(curY + 4, cY + cH - 225);
      var lawH = (cY + cH - 80) - lawY;
      if (lawH > 55) {
        roundRect(ctx, tX, lawY, tW, lawH, 6, '#f8fafc', true, '#cbd5e1', 1.5);
        ctx.fillStyle = '#1e293b';
        ctx.font = 'bold 16.5px ' + fontName;
        drawWrappedRTL(ctx, data.lawText, tX + tW - 12, lawY + 25, tW - 24, 24, 5);
      }
    }

    var signY = cY + cH - 26;
    ctx.fillStyle = '#000';
    ctx.font = 'bold 20px ' + fontName;
    ctx.textAlign = 'right';
    ctx.fillText('امضای مشتری: ....................................', tX + tW - 10, signY);
    ctx.textAlign = 'left';
    ctx.fillText('مهر و امضای تعمیرگاه: ....................................', tX + 10, signY);

    // خط برش وسط
    var cutY = 1068;
    ctx.save();
    ctx.beginPath();
    ctx.setLineDash([12, 10]);
    ctx.moveTo(40, cutY);
    ctx.lineTo(W - 40, cutY);
    ctx.strokeStyle = '#64748b';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(W / 2 - 150, cutY - 16, 300, 32);
    ctx.fillStyle = '#475569';
    ctx.font = 'bold 20px ' + fontName;
    ctx.textAlign = 'center';
    ctx.fillText('✂ ────── محل برش ────── ✂', W / 2, cutY + 7);

    // نیمه پایینی (نسخه کارگاه + یادداشت تعمیرکار)
    var sX = 32, sY = 1094, sW = W - 64, sH = 974;
    roundRect(ctx, sX, sY, sW, sH, 12, '#ffffff', true, '#222222', 3.5);

    var splitX = sX + Math.round(sW * 0.33);
    ctx.save();
    ctx.beginPath();
    ctx.setLineDash([10, 8]);
    ctx.moveTo(splitX, sY + 10);
    ctx.lineTo(splitX, sY + sH - 10);
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();

    var wRight = sX + sW - 22;
    var wWidth = (sX + sW) - splitX - 44;
    var wCenter = splitX + ((sX + sW - splitX) / 2);

    roundRect(ctx, sX + sW - 145, sY + 16, 125, 40, 6, '#f1f5f9', true, '#333', 2);
    ctx.fillStyle = '#000';
    ctx.font = 'bold 20px ' + fontName;
    ctx.textAlign = 'center';
    ctx.fillText('نسخه کارگاه', sX + sW - 82, sY + 42);

    ctx.font = '900 30px ' + fontName;
    ctx.fillText('پرونده فنی کارگاه', wCenter, sY + 46);
    ctx.font = 'bold 20px ' + fontName;
    ctx.fillStyle = '#334155';
    ctx.fillText(data.shopHeaderSub || '', wCenter, sY + 80);

    var wy = sY + 105;
    ctx.beginPath(); ctx.moveTo(splitX + 18, wy); ctx.lineTo(sX + sW - 18, wy);
    ctx.strokeStyle = '#333'; ctx.lineWidth = 2; ctx.stroke();
    wy += 34;

    ctx.fillStyle = '#000';
    ctx.font = 'bold 21px ' + fontName;
    for (var smI = 0; smI < data.shopMetaLines.length; smI++) {
      wy = drawWrappedRTL(ctx, data.shopMetaLines[smI], wRight, wy, wWidth, 32, 2);
    }
    wy += 10;

    var techBoxH = Math.max(200, (sY + sH - 30) - wy);
    roundRect(ctx, splitX + 20, wy, wWidth, techBoxH, 8, '#f8fafc', true, '#cbd5e1', 2);
    var ty = wy + 34;
    ctx.fillStyle = '#0f172a';
    ctx.font = 'bold 20px ' + fontName;
    for (var stI = 0; stI < data.shopTechLines.length; stI++) {
      if (ty < wy + techBoxH - 20) {
        ty = drawWrappedRTL(ctx, '• ' + data.shopTechLines[stI], wRight - 14, ty, wWidth - 28, 33, 3);
        ty += 4;
      }
    }

    var nCenter = sX + ((splitX - sX) / 2);
    ctx.fillStyle = '#000';
    ctx.font = '900 24px ' + fontName;
    ctx.textAlign = 'center';
    ctx.fillText('📝 یادداشت و گزارش تعمیرکار', nCenter, sY + 52);

    ctx.beginPath(); ctx.moveTo(sX + 18, sY + 75); ctx.lineTo(splitX - 18, sY + 75);
    ctx.strokeStyle = '#475569'; ctx.lineWidth = 2; ctx.stroke();

    ctx.strokeStyle = '#cbd5e1';
    ctx.lineWidth = 1.5;
    for (var ly = sY + 135; ly < sY + sH - 110; ly += 55) {
      ctx.beginPath();
      ctx.moveTo(sX + 20, ly);
      ctx.lineTo(splitX - 20, ly);
      ctx.stroke();
    }

    ctx.fillStyle = '#000';
    ctx.font = 'bold 19px ' + fontName;
    ctx.textAlign = 'right';
    ctx.fillText('امضای تکنسین و تاریخ تحویل:', splitX - 22, sY + sH - 65);
    ctx.fillText('................................................', splitX - 22, sY + sH - 28);

    return canvas;
  }

  function canvasToA5PdfBlob(canvas) {
    var jpegDataUrl = canvas.toDataURL('image/jpeg', 0.92);
    var rawJpeg = atob(jpegDataUrl.split(',')[1]);
    var jpegLen = rawJpeg.length;
    var chunks = [], offsets = [], currentLen = 0;

    function pushStr(str) {
      var arr = new Uint8Array(str.length);
      for (var i = 0; i < str.length; i++) arr[i] = str.charCodeAt(i) & 0xff;
      chunks.push(arr);
      currentLen += arr.length;
    }
    function startObj(id) {
      offsets[id] = currentLen;
      pushStr(id + ' 0 obj\n');
    }

    pushStr('%PDF-1.4\n%\xFF\xFF\xFF\xFF\n');
    startObj(1); pushStr('<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
    startObj(2); pushStr('<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n');
    startObj(3); pushStr('<< /Type /Page /Parent 2 0 R /Resources << /XObject << /Im0 4 0 R >> >> /MediaBox [0 0 420 595] /Contents 5 0 R >>\nendobj\n');
    startObj(4);
    pushStr('<< /Type /XObject /Subtype /Image /Width ' + canvas.width + ' /Height ' + canvas.height + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + jpegLen + ' >>\nstream\n');
    var jpegBytes = new Uint8Array(jpegLen);
    for (var j = 0; j < jpegLen; j++) jpegBytes[j] = rawJpeg.charCodeAt(j) & 0xff;
    chunks.push(jpegBytes);
    currentLen += jpegLen;
    pushStr('\nendstream\nendobj\n');

    var contentCmd = 'q 420 0 0 595 0 0 cm /Im0 Do Q\n';
    startObj(5); pushStr('<< /Length ' + contentCmd.length + ' >>\nstream\n' + contentCmd + 'endstream\nendobj\n');

    var xrefOffset = currentLen;
    pushStr('xref\n0 6\n0000000000 65535 f \n');
    for (var k = 1; k <= 5; k++) pushStr(String(offsets[k]).padStart(10, '0') + ' 00000 n \n');
    pushStr('trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n' + xrefOffset + '\n%%EOF');

    return new Blob(chunks, { type: 'application/pdf' });
  }

  function blobToBase64(blob) {
    return new Promise(function(resolve) {
      var reader = new FileReader();
      reader.onloadend = function() {
        var res = reader.result || '';
        resolve(res.split(',')[1] || '');
      };
      reader.readAsDataURL(blob);
    });
  }

  window.exportPersiaInvoice = async function(format) {
    if (!_lastCanvas) return;
    var isPdf = (format === 'PDF');
    var btn = document.getElementById(isPdf ? 'pps-btn-pdf' : 'pps-btn-png');
    var origText = btn ? btn.innerHTML : '';
    if (btn) { btn.innerHTML = '⏳...'; btn.disabled = true; }

    function done() {
      if (btn) { btn.innerHTML = origText; btn.disabled = false; }
    }

    try {
      var ext = isPdf ? '.pdf' : '.png';
      var mime = isPdf ? 'application/pdf' : 'image/png';
      var filename = 'Invoice_' + _lastCode + '_' + Date.now() + ext;
      var blob = isPdf
        ? canvasToA5PdfBlob(_lastCanvas)
        : await new Promise(function(r) { _lastCanvas.toBlob(r, 'image/png'); });

      var Cap = window.Capacitor && window.Capacitor.Plugins;
      if (Cap && Cap.Filesystem) {
        var b64Data = await blobToBase64(blob);
        var dirsToTry = ['DOCUMENTS', 'EXTERNAL_STORAGE', 'CACHE'];
        var dirLabels = {
          'DOCUMENTS': 'Documents (اسناد)',
          'EXTERNAL_STORAGE': 'حافظه داخلی گوشی',
          'CACHE': 'کش برنامه'
        };
        var savedInfo = null;

        for (var d = 0; d < dirsToTry.length; d++) {
          try {
            var writeRes = await Cap.Filesystem.writeFile({
              path: filename,
              data: b64Data,
              directory: dirsToTry[d],
              encoding: 'base64',
              recursive: true
            });
            savedInfo = { dir: dirsToTry[d], label: dirLabels[dirsToTry[d]], uri: writeRes.uri };
            break;
          } catch (e) {}
        }

        if (savedInfo) {
          done();
          if (Cap.Share) {
            try {
              await Cap.Share.share({
                title: 'فاکتور موبایل پرشیا (' + _lastCode + ')',
                text: 'فایل ذخیره شد در: ' + savedInfo.label + '\n' + filename,
                url: savedInfo.uri,
                dialogTitle: 'چاپ یا اشتراک‌گذاری فاکتور'
              });
            } catch (se) {}
          }
          showPathInfoModal(savedInfo.label, filename);
          return;
        }
      }

      var fileObj = new File([blob], filename, { type: mime });
      if (navigator.canShare && navigator.canShare({ files: [fileObj] })) {
        await navigator.share({ title: 'فاکتور موبایل پرشیا (' + _lastCode + ')', files: [fileObj] });
        done();
        return;
      }

      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      a.click();
      done();
      if (typeof showToast === 'function') showToast('✅ فایل دانلود شد', 'success');
    } catch (err) {
      done();
      alert('خطا در ذخیره فایل: ' + (err && err.message ? err.message : ''));
    }
  };

  // پشتیبانی از printCollabSummaryStatement و هر جای دیگری که window.print() را صدا بزند
  window.print = function() {
    var sec = document.getElementById('print-section');
    if (sec && sec.innerText.trim().length > 5) {
      var rows = [];
      var trs = sec.querySelectorAll('table tr');
      for (var r = 0; r < trs.length; r++) {
        var cols = [];
        var tds = trs[r].querySelectorAll('th, td');
        for (var c = 0; c < tds.length; c++) cols.push(tds[c].innerText.trim());
        if (cols.length > 0) rows.push(cols);
      }
      var lines = sec.innerText.split('\n').map(function(s){return s.trim();}).filter(Boolean);
      openStudioWithData({ mode: 'SINGLE_PAGE', rawLines: lines, table: rows });
    } else {
      try { _nativePrint(); } catch (e) {}
    }
  };
