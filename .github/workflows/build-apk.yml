name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Capacitor CLI and dependencies
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/app @capacitor/splash-screen
          npm install --save-dev @capacitor/assets

      - name: Prepare www folder
        run: |
          mkdir -p www
          cp index.html www/
          cp manifest.json www/
          cp sw.js www/
          cp icon.png www/
          cp brands-db.js www/
          cp patch.js www/
          cp splash.jpg www/ 2>/dev/null || true
          mkdir -p www/font
          cp -r font/* www/font/ 2>/dev/null || true

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icons and splash screens
        run: |
          mkdir -p assets
          cp icon.png assets/icon.png
          cp icon.png assets/icon-foreground.png
          cp icon.png assets/icon-background.png
          cp splash.jpg assets/splash.png 2>/dev/null || true
          cp splash.jpg assets/splash-dark.png 2>/dev/null || true
          npx @capacitor/assets generate --android
        continue-on-error: true

      - name: Sync Capacitor
        run: npx cap sync android

      # ─────────────────────────────────────────────────────
      # 🔐 مراحل امضای Release (بدون دست زدن به build.gradle اصلی)
      # ─────────────────────────────────────────────────────

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/my-release-key.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=my-release-key.jks
          EOF

      - name: Patch build.gradle with signing config
        run: |
          cd android/app
          # اضافه کردن لود key.properties به بالای فایل
          python3 << 'PYEOF'
          import re

          with open('build.gradle', 'r', encoding='utf-8') as f:
              content = f.read()

          # 1. اضافه کردن لود key.properties بعد از apply plugin
          key_props_block = '''
          def keystorePropertiesFile = rootProject.file("key.properties")
          def keystoreProperties = new Properties()
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }
          '''

          # پیدا کردن اولین "apply plugin: 'com.android.application'" و اضافه کردن بعدش
          content = re.sub(
              r"(apply plugin:\s*['\"]com\.android\.application['\"])",
              r"\1\n" + key_props_block,
              content,
              count=1
          )

          # 2. اضافه کردن signingConfigs داخل بلاک android
          signing_block = '''    signingConfigs {
                      release {
                          if (keystorePropertiesFile.exists()) {
                              storeFile file(keystoreProperties['storeFile'])
                              storePassword keystoreProperties['storePassword']
                              keyAlias keystoreProperties['keyAlias']
                              keyPassword keystoreProperties['keyPassword']
                          }
                      }
                  }

                  '''

          # پیدا کردن "buildTypes {" و اضافه کردن signingConfigs قبلش
          content = re.sub(
              r"(\s*buildTypes\s*\{)",
              "\n" + signing_block + r"\1",
              content,
              count=1
          )

          # 3. تزریق signingConfig به release
          content = re.sub(
              r"(release\s*\{[^}]*?)(minifyEnabled\s+false)",
              r"\1\2\n                signingConfig signingConfigs.release",
              content,
              count=1
          )

          with open('build.gradle', 'w', encoding='utf-8') as f:
              f.write(content)

          print("✅ build.gradle patched successfully")
          PYEOF

      - name: Verify Gradle patched file
        run: |
          echo "===== build.gradle content ====="
          cat android/app/build.gradle
          echo "===== key.properties ====="
          cat android/key.properties
          echo "===== keystore exists? ====="
          ls -la android/app/my-release-key.jks

      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Rename APK
        run: |
          mkdir -p apk-out
          cp android/app/build/outputs/apk/release/app-release.apk apk-out/persia-mobile-signed.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: persia-mobile-apk
          path: apk-out/persia-mobile-signed.apk
