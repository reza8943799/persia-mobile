name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor CLI and dependencies
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npm install --save-dev @capacitor/assets

      - name: Prepare www folder
        run: |
          mkdir -p www
          cp index.html www/
          cp manifest.json www/
          cp sw.js www/
          cp icon.png www/
          cp brands-db.js www/
          cp patch.js www/
          mkdir -p www/font
          cp -r font/* www/font/ 2>/dev/null || true

      - name: Init Capacitor
        run: |
          npx cap init "موبایل پرشیا" "com.persia.mobile" --web-dir=www

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icons and splash screens
        run: |
          mkdir -p assets
          cp icon.png assets/icon.png
          npx @capacitor/assets generate --android
        continue-on-error: true

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: persia-mobile-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
