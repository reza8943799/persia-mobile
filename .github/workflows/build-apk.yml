name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Capacitor CLI and dependencies
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/app @capacitor/splash-screen
          npm install --save-dev @capacitor/assets

      - name: Prepare www folder
        run: |
          mkdir -p www
          cp index.html www/
          cp manifest.json www/
          cp sw.js www/
          cp icon.png www/
          cp brands-db.js www/
          cp patch.js www/
          cp splash.jpg www/ 2>/dev/null || true
          mkdir -p www/font
          cp -r font/* www/font/ 2>/dev/null || true

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icons and splash screens
        run: |
          mkdir -p assets
          cp icon.png assets/icon.png
          cp icon.png assets/icon-foreground.png
          cp icon.png assets/icon-background.png
          cp splash.jpg assets/splash.png 2>/dev/null || true
          cp splash.jpg assets/splash-dark.png 2>/dev/null || true
          npx @capacitor/assets generate --android
        continue-on-error: true

      - name: Sync Capacitor
        run: npx cap sync android

      # ─────────────────────────────────────────────────────
      # 🔐 مراحل امضای Release (اضافه‌شده)
      # ─────────────────────────────────────────────────────

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/my-release-key.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=../app/my-release-key.jks
          EOF

      - name: Patch build.gradle for Release signing
        run: |
          cat > android/app/build.gradle << 'GRADLE_EOF'
          apply plugin: 'com.android.application'

          android {
              namespace "com.persia.mobile"
              compileSdk rootProject.ext.compileSdkVersion

              defaultConfig {
                  applicationId "com.persia.mobile"
                  minSdkVersion rootProject.ext.minSdkVersion
                  targetSdkVersion rootProject.ext.targetSdkVersion
                  versionCode 1
                  versionName "1.0"
                  testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
                  aaptOptions {
                      ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
                  }
              }

              signingConfigs {
                  release {
                      if (rootProject.file('key.properties').exists()) {
                          def keystoreProperties = new Properties()
                          keystoreProperties.load(new FileInputStream(rootProject.file('key.properties')))
                          storeFile file(keystoreProperties['storeFile'])
                          storePassword keystoreProperties['storePassword']
                          keyAlias keystoreProperties['keyAlias']
                          keyPassword keystoreProperties['keyPassword']
                      }
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
                      signingConfig signingConfigs.release
                  }
              }
          }

          repositories {
              flatDir{
                  dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
              }
          }

          dependencies {
              implementation fileTree(include: ['*.jar'], dir: 'libs')
              implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
              implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
              implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
              implementation project(':capacitor-android')
              testImplementation "junit:junit:$junitVersion"
              androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
              androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
              implementation project(':capacitor-cordova-android-plugins')
          }

          apply from: 'capacitor.build.gradle'

          try {
              def servicesJSON = file('google-services.json')
              if (servicesJSON.text) {
                  apply plugin: 'com.google.gms.google-services'
              }
          } catch(Exception e) {
              logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
          }
          GRADLE_EOF

      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      # ─────────────────────────────────────────────────────
      # 📤 آپلود فایل‌ها
      # ─────────────────────────────────────────────────────

      - name: Rename APK
        run: |
          mkdir -p apk-out
          cp android/app/build/outputs/apk/release/app-release.apk apk-out/persia-mobile-signed.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: persia-mobile-apk
          path: apk-out/persia-mobile-signed.apk
