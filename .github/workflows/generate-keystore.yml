name: Generate Keystore (One Time)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore my-release-key.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias my-key-alias \
            -storepass PersiaMobile1404 \
            -keypass PersiaMobile1404 \
            -dname "CN=Persia Mobile, OU=Dev, O=Persia, L=Tehran, S=Tehran, C=IR"
          
          echo "✅ Keystore ساخته شد"
          
          # نمایش Base64 برای کپی کردن
          echo "========== KEYSTORE_BASE64 =========="
          base64 -w 0 my-release-key.jks
          echo ""
          echo "========== پایان =========="

      - name: Upload Keystore as artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: my-release-key.jks
          retention-days: 30
